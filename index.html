<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KB Subsection Assignment</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;background:#f0efed;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#toolbar{background:#fff;border-bottom:1px solid #ddd;padding:6px 12px;display:flex;align-items:center;gap:3px;flex-shrink:0;z-index:10}
#toolbar button{display:flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;font-size:11.5px;font-weight:500;color:#3a3a3a;transition:background .12s,border-color .12s}
#toolbar button svg{flex-shrink:0;display:block}
#toolbar button:disabled{opacity:.32;cursor:default}
#toolbar button:not(:disabled):hover{background:#f1f1ef;border-color:#e6e6e3}
#toolbar button:not(:disabled):active{background:#e6e6e3}
#toolbar #zoom-label{font-size:11px;color:#888;min-width:34px;text-align:center;font-weight:500}
#toolbar .sep{width:1px;height:18px;background:#e2e2e0;margin:0 4px}
/* macOS-style pill toggle */
.mac-tog-wrap{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#3a3a3a;font-weight:500;user-select:none}
.mac-tog-wrap svg{margin-right:-4px}
.mac-tog-wrap svg{flex-shrink:0;opacity:1}
.mac-tog{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.mac-tog input{position:absolute;opacity:0;width:0;height:0}
.mac-tog-track{
  position:absolute;inset:0;border-radius:10px;background:#d1d1d6;
  cursor:pointer;transition:background .2s;
}
.mac-tog input:checked+.mac-tog-track{background:#007aff}
.mac-tog-thumb{
  position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.08);
  transition:transform .18s cubic-bezier(.34,1.2,.64,1);
  pointer-events:none;
}
.mac-tog input:checked~.mac-tog-thumb{transform:translateX(16px)}
#hint{font-size:11px;color:#aaa;flex:1}
#status-msg{font-size:11px;color:#4a8;font-weight:600}
#zoom-label{min-width:36px;text-align:center;font-size:11px;font-weight:600;color:#555}
#sel-badge{display:none;background:#5a8fd8;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px;white-space:nowrap}
#app{display:flex;flex:1;gap:10px;padding:10px;overflow:hidden}
.col{flex:1;background:#fff;border-radius:6px;border:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.col-head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#888;padding:9px 12px 7px;border-bottom:1px solid #eee;flex-shrink:0;display:flex;align-items:center}
.col-head .col-title{flex:1}
.col-head .col-tog{display:flex;align-items:center;padding:2px 4px;border:1px solid transparent;border-radius:5px;cursor:pointer;color:#bbb;background:none;transition:background .12s,color .12s}
.col-head .col-tog:hover{background:#f1f1ef;border-color:#e6e6e3;color:#555}
.col.collapsed{flex:0 0 36px !important;min-width:36px !important}
.col.collapsed .col-body{display:none}
.col.collapsed .col-head{flex-direction:column;padding:10px 6px;gap:8px;border-bottom:none;height:100%;writing-mode:vertical-lr;justify-content:flex-start}
.col.collapsed .col-title{writing-mode:vertical-lr;font-size:10px;letter-spacing:.1em;white-space:nowrap}
.col.collapsed .col-tog{writing-mode:horizontal-tb;transform:rotate(0deg)}
#app.lcol-collapsed{padding-left:0}
#app.rcol-collapsed{padding-right:0}
.col-body{flex:1;overflow-y:auto;padding:4px 0 12px}
.col-inner{transform-origin:top left}

/* Tree nodes */
.cat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#bbb;padding:10px 12px 3px;margin-top:2px}
.cat-label:first-child{padding-top:6px}
.node-row{display:flex;align-items:center;gap:2px;padding:2px 8px;cursor:default;border-radius:0;transition:background .08s}
.node-row:hover{background:rgba(0,0,0,.04)}
.node-row.selected{background:#d6e8ff;outline:1px solid #5a8fd8}
.node-row.selected .chip{border-left-color:#5a8fd8!important;font-weight:600}
.node-row.dragging-source{opacity:.35}
.tog{flex-shrink:0;width:14px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#999;border-radius:2px;user-select:none}
.tog:hover{background:rgba(0,0,0,.07);color:#666}
.tog.placeholder{cursor:default}
.tog.placeholder:hover{background:none}
.chip{padding:2.5px 7px;border-radius:3px;font-size:11.5px;display:flex;align-items:baseline;gap:5px;min-width:0;flex:1}
.chip .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cnt{font-size:10px;color:#aaa;flex-shrink:0}
/* draggable items */
.draggable .chip{border-left:2px solid #e0e0e0;cursor:grab}
.draggable:not(.assigned) .chip:hover{border-left-color:#aaa}
.draggable.selected .chip{border-left-color:#5a8fd8}
.draggable.assigned .chip{border-left-color:#d0d0d0;opacity:.7}
.assign-tag{font-size:9.5px;color:#888;background:#f0f0ee;border-radius:3px;padding:1px 5px;white-space:nowrap;flex-shrink:0;max-width:110px;overflow:hidden;text-overflow:ellipsis}
/* article count leaf */
.art-count{font-size:10px;color:#ccc;font-style:italic;padding:1px 0 1px 6px}
/* article links */
.art-row{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.art-link{font-size:10.5px;color:#2563a0;text-decoration:none;line-height:1.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-link:hover{text-decoration:underline;color:#1a4a7a}
.art-loading{font-size:10px;color:#bbb;font-style:italic;padding:1px 0 1px 6px}
/* indentation — the only source of padding-left */
.l2{padding-left:8px}.l3{padding-left:28px}.l4{padding-left:48px}.l5{padding-left:88px}
/* toggle-width spacer for URL rows that have no toggle */
.tog-spacer{flex-shrink:0;width:14px}
/* right panel */
.suite-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#aaa;padding:8px 12px 3px;margin-top:0}
.suite-block.pe  .suite-label { color:#1a5f8a }
.suite-block.ms  .suite-label { color:#1a6b3c }
.suite-block.dcs .suite-label { color:#7a4510 }
.suite-block.dls .suite-label { color:#7a5f10 }
.suite-block.aas .suite-label { color:#5a2d8a }
.rsec-row{display:flex;align-items:center;gap:2px;padding-top:2px;padding-bottom:2px;transition:background .1s}
.rsec-chip{padding:3px 7px;border-radius:4px;font-size:11.5px;display:flex;align-items:baseline;gap:5px;flex:1;border:1.5px solid transparent}
.rsec-chip .lbl{flex:1}
.rsec-chip .cnt{font-size:10px;color:#aaa}
.rsec-row.drop-active .rsec-chip{border-color:#4a8;background:rgba(60,160,100,.06)!important}
.suite-block{border-radius:4px;transition:background .15s;margin-bottom:2px}
.suite-block.suite-drop-active{background:rgba(60,160,100,.07);outline:2px dashed #4a8}
/* per-suite background wash — lighter than chip color so chips remain distinct */
.suite-block.pe  { background:#edf5fd; border-top:2px solid #aed0ef }
.suite-block.ms  { background:#ebf7f1; border-top:2px solid #8ed0b0 }
.suite-block.dcs { background:#fdf4e8; border-top:2px solid #e8c38a }
.suite-block.dls { background:#fdfae8; border-top:2px solid #e8db8a }
.suite-block.aas { background:#f3ebfd; border-top:2px solid #c9a8ed }
.promote-btn{flex-shrink:0;width:18px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#888;font-size:11px;border-radius:2px;user-select:none;transition:opacity .1s}
.promote-btn:hover{background:rgba(0,0,0,.07);color:#4a8}
.grip{flex-shrink:0;width:12px;cursor:ns-resize;color:#ccc;font-size:9px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .1s;user-select:none;letter-spacing:-1px}
.rsec-row:hover .grip,.assigned-item:hover .grip,.assigned-sec-header:hover .grip,.art-row:hover .grip{opacity:1}
.grip:hover{color:#888}
/* all × always faintly visible; full on hover */
.remove-btn{opacity:.3}
.promote-btn{opacity:.2}
.assigned-sec-header:hover .remove-btn,.assigned-sec-header:hover .promote-btn,
.assigned-item:hover .remove-btn,.assigned-item:hover .promote-btn,
.rsec-row:hover .remove-btn{opacity:1}
/* remove the separate L2-only rule — already covered above */
#insert-line{position:fixed;height:2px;background:#4a8;border-radius:1px;pointer-events:none;z-index:9999;display:none;box-shadow:0 0 4px rgba(60,160,100,.4)}
.drag-ghost{position:fixed;pointer-events:none;z-index:9998;background:#fff;border:1px solid #aaa;border-radius:4px;padding:3px 10px;font-size:11px;color:#333;box-shadow:0 2px 12px rgba(0,0,0,.18);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;opacity:.93;display:none}
#history-drawer{position:fixed;bottom:0;left:0;right:0;height:220px;background:#fff;border-top:1px solid #ddd;z-index:200;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .2s ease;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
#history-drawer.open{transform:translateY(0)}
#history-header{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid #eee;background:#f8f8f8;flex-shrink:0}
#history-header .ht{font-size:12px;font-weight:600;color:#333;flex:1}
#history-header .hnav{display:flex;align-items:center;gap:4px}
#history-header .hnav button{display:flex;align-items:center;gap:3px;padding:3px 8px;border:1px solid transparent;border-radius:5px;background:transparent;font-size:11px;font-weight:500;color:#3a3a3a;cursor:pointer}
#history-header .hnav button:hover:not(:disabled){background:#f1f1ef;border-color:#e6e6e3}
#history-header .hnav button:disabled{opacity:.3;cursor:default}
#history-pos{font-size:11px;color:#888;min-width:44px;text-align:center}
#history-close{display:flex;align-items:center;padding:3px 6px;border:none;background:none;cursor:pointer;color:#999;font-size:14px}
#history-close:hover{color:#333}
#history-list{flex:1;overflow-y:auto;font-family:'SF Mono',monospace;font-size:var(--hlog-size,11px)}
.hentry{padding:5px 14px;border-bottom:1px solid #ebebeb;cursor:default;white-space:pre;line-height:1.6;color:#000}
.hentry.current{background:#edf8f2;border-left:3px solid #4a8;padding-left:11px}

.hentry.event{background:#eef2ff;border-left:3px solid #7090c0;padding-left:11px;color:#000}
.hentry .hts{color:#000;font-size:.9em;margin-right:8px}
.hentry .htext{color:#000}
.assigned-sec-header.drop-active,.assigned-item.drop-active{background:rgba(60,160,100,.08);outline:1.5px solid #4a8;border-radius:3px}
.sec-child-row.drop-active{background:rgba(60,160,100,.1);outline:1.5px solid #4a8;border-radius:3px}
.drop-hint{font-size:10px;color:#ccc;padding-top:2px;padding-bottom:2px;font-style:italic}
.assigned-item{display:flex;align-items:center;gap:3px;padding-top:2px;padding-bottom:2px;cursor:grab;border-radius:0}
.assigned-item:hover{background:rgba(0,0,0,.04)}
.assigned-item.dragging-source{opacity:.35}
.assigned-chip{font-size:11px;color:#555;padding:2px 7px;border-radius:3px;background:rgba(0,0,0,.03);border-left:2px solid #ddd;flex:1;display:flex;align-items:baseline;gap:5px;min-width:0}
.assigned-chip .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.assigned-chip .cnt{font-size:9.5px;color:#bbb;flex-shrink:0}
.remove-btn{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;border-radius:2px;cursor:pointer;flex-shrink:0;user-select:none;transition:opacity .1s}
.remove-btn:hover{background:#fee;color:#e55}
/* subsubsection */
.subsub-row{display:flex;align-items:center;gap:2px;padding-top:1.5px;padding-bottom:1.5px}
.subsub-chip{font-size:10.5px;color:#888;padding:1.5px 7px;border-radius:3px;background:rgba(0,0,0,.02);border-left:2px solid #ebebeb;flex:1;display:flex;align-items:baseline;gap:4px}
.subsub-chip .lbl{flex:1}
.subsub-chip .cnt{font-size:9.5px;color:#bbb}
/* colors */
.gs{background:#e8f4fd;color:#1a5f8a}
.me{background:#e8f7f0;color:#1a6b3c}
.ao{background:#fdf3e8;color:#7a4510}
.pt{background:#f3eafd;color:#5a2d8a}
.pe{background:#e8f4fd;color:#1a5f8a}
.ms{background:#e8f7f0;color:#1a6b3c}
.dcs{background:#fdf3e8;color:#7a4510}
.dls{background:#fef9e8;color:#7a5f10}
.aas{background:#f3eafd;color:#5a2d8a}
/* redundant intermediate — sole assignment in its section, will be flattened */
.assigned-chip.redundant { border-left-style: dashed; border-left-color: #aab; opacity: 0.7; }
.assigned-chip.redundant .lbl { font-style: italic; }
/* assigned section (L3 with children) on right panel */
.assigned-sec-header{display:flex;align-items:center;gap:3px;padding-top:2px;padding-bottom:2px;cursor:grab}
.assigned-sec-header:hover{background:rgba(0,0,0,.04)}
.r-tog{flex-shrink:0;width:15px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#999;border-radius:2px;user-select:none}
.r-tog:hover{background:rgba(0,0,0,.07);color:#555}
.assigned-sec-children{}
.sec-child-row{display:flex;align-items:baseline;gap:5px;padding-top:1.5px;padding-bottom:1.5px;font-size:10.5px;color:#777}
.sec-child-row .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-child-row .cnt{font-size:9.5px;color:#bbb;flex-shrink:0}
.sec-child-row .subsub-lbl{font-size:9.5px;color:#bbb;padding-left:10px;flex:1}
/* ghost */
#ghost{position:fixed;pointer-events:none;z-index:9999;display:none;background:#222;color:#fff;padding:5px 10px;border-radius:5px;font-size:11px;font-family:-apple-system,sans-serif;box-shadow:0 3px 12px rgba(0,0,0,.35);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<!-- Firebase SDK (compat, loads as global firebase object) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="ghost"></div>
<div id="insert-line"></div>
<div id="sync-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#1a73e8;color:#fff;padding:7px 16px;font-size:12px;z-index:10000;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)">
  <span style="font-size:14px">📡</span>
  <span id="sync-banner-text" style="flex:1"></span>
  <button onclick="applySyncFromFirebase()" style="background:#fff;color:#1a73e8;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600">Apply now</button>
  <button onclick="this.closest('#sync-banner').style.display='none'" style="background:transparent;color:#fff;border:none;cursor:pointer;font-size:16px;line-height:1;padding:0 4px">×</button>
</div>
<div id="drag-ghost" class="drag-ghost"></div>
<div id="history-drawer">
  <div id="history-header">
    <span class="ht">Movement Log</span>
    <div class="hnav">
      <button id="hbtn-prev" onclick="undoAndRefreshHistory()" title="Previous step">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 2 4 5.5 7 9"/></svg> Prev
      </button>
      <span id="history-pos">0 / 0</span>
      <button id="hbtn-next" onclick="redoAndRefreshHistory()" title="Next step">
        Next <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 2 7 5.5 4 9"/></svg>
      </button>
      <button onclick="exportLog()" title="Download log as text file" style="margin-left:4px">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1v6"/><path d="M3.5 5l2.5 2.5 2.5-2.5"/><path d="M1 9.5v1a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5v-1"/></svg>
        Export
      </button>
      <button onclick="logZoom(-1)" title="Smaller text" style="margin-left:4px;padding:3px 6px">
        <svg width="11" height="11" viewBox="0 0 11 11"><line x1="2" y1="5.5" x2="9" y2="5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button onclick="logZoom(1)" title="Larger text" style="padding:3px 6px">
        <svg width="11" height="11" viewBox="0 0 11 11"><line x1="2" y1="5.5" x2="9" y2="5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="5.5" y1="2" x2="5.5" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button id="history-close" onclick="toggleHistoryDrawer()" title="Close">×</button>
  </div>
  <div id="history-list"></div>
</div>
<div id="toolbar">
  <span id="fb-status" style="font-size:10px;color:#999;margin-right:4px;min-width:6px" title="Firebase sync status">●</span>
  <button id="btn-undo" disabled onclick="undo()" title="Undo">
  <button id="btn-redo" disabled onclick="redo()" title="Redo">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="8.8 8.2 11.7 5.2 8.8 2.3"/><path d="M2.3 11.7v-4a2.3 2.3 0 0 1 2.3-2.3h7"/></svg>
    Redo
  </button>
  <div class="sep"></div>
  <button onclick="zoomOut()" title="Zoom out">
    <svg width="11" height="11" viewBox="0 0 11 11"><line x1="2" y1="5.5" x2="9" y2="5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <span id="zoom-label">120%</span>
  <button onclick="zoomIn()" title="Zoom in">
    <svg width="11" height="11" viewBox="0 0 11 11"><line x1="2" y1="5.5" x2="9" y2="5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="5.5" y1="2" x2="5.5" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button onclick="zoomReset()" title="Reset zoom to 120%">120%</button>
  <div class="sep"></div>
  <button onclick="saveProgress()" title="Save progress">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 1v6.5"/><path d="M4 5.5l2.5 2.5l2.5-2.5"/><path d="M2 9.5v1.5a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V9.5"/></svg>
    Save
  </button>
  <button onclick="loadProgressClick()" title="Load progress">
    <svg width="13" height="12" viewBox="0 0 13 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h2.5l1 1.5H11a1 1 0 0 1 1 1z"/></svg>
    Load
  </button>
  <button onclick="resetToLastSave()" title="Revert to last saved state">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5.2 8.2 2.3 5.2 5.2 2.3"/><path d="M2.3 5.2h5.5a3 3 0 0 1 0 6H5.5"/></svg>
    Reset
  </button>
  <input type="file" id="load-input" accept=".json" style="display:none" onchange="loadProgress(this)">
  <div class="sep"></div>
  <button onclick="toggleHistoryDrawer()" title="Toggle movement log">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="5"/><polyline points="6.5 3.5 6.5 6.5 8.5 7.5"/></svg>
    Log
  </button>
  <div class="sep"></div>
  <div class="mac-tog-wrap" title="Collapse all suites and sections">
    <!-- fold chevron resting on a baseline = collapse -->
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 9.3 L7.5 5.3 L11.5 9.3"/>
      <line x1="2.5" y1="12.3" x2="12.5" y2="12.3"/>
    </svg>
    <span>Collapse</span>
    <label class="mac-tog">
      <input type="checkbox" id="collapse-all-cb">
      <span class="mac-tog-track"></span>
      <span class="mac-tog-thumb"></span>
    </label>
  </div>

function effectiveNavPos(node) {
  if (node.zid != null) return NAV_SECTION_ORDER[node.zid] ?? 9999;
  if (node.children && node.children.length)
    return Math.min(...node.children.map(effectiveNavPos));
  return 9999;
}

function applyNavOrder(nodes) {
  nodes.sort((a, b) => effectiveNavPos(a) - effectiveNavPos(b));
  nodes.forEach(n => n.children && applyNavOrder(n.children));
}

// ── Order helpers ──────────────────────────────────────────────────────────
function sortedAssigned(secId) {
  const pairs = Object.entries(S.assignments).filter(([,v]) => v === secId);
  const order = S.sectionOrder[secId];
  if (!order) return pairs;
  return [...pairs].sort(([a],[b]) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    if (ai === -1 && bi === -1) return 0;
    return (ai === -1 ? 1e9 : ai) - (bi === -1 ? 1e9 : bi);
  });
}

function sortedArticles(zid) {
  const arts = S.articleCache[zid];
  if (!arts) return arts;
  const order = S.articleOrder[zid];
  if (!order) return arts;
  return [...arts].sort((a, b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    if (ai === -1 && bi === -1) return 0;
    return (ai === -1 ? 1e9 : ai) - (bi === -1 ? 1e9 : bi);
  });
}

function applyReorder(arr, fromId, beforeId) {
  const result = arr.filter(id => id !== fromId);
  const insertIdx = beforeId ? result.indexOf(beforeId) : result.length;
  result.splice(insertIdx === -1 ? result.length : insertIdx, 0, fromId);
  return result;
}

// Returns ordered array of {type:'node'|'sec', id, key} for all L3 items in a section.
// key format: 'n:nodeId' for assigned, 's:subSecId' for subsections.
function getUnifiedL3Items(secId) {
  const sec = rsecIndex[secId];
  const nodeKeys = sortedAssigned(secId).map(([id]) => 'n:' + id);
  const subKeys  = (sec?.subsections || []).map(s => 's:' + s.id);
  const stored   = S.sectionOrder[secId];
  let keys;
  if (!stored || !stored.some(k => k.includes(':'))) {
    keys = [...nodeKeys, ...subKeys];
  } else {
    const all = new Set([...nodeKeys, ...subKeys]);
    keys = stored.filter(k => all.has(k));
    [...nodeKeys, ...subKeys].forEach(k => { if (!keys.includes(k)) keys.push(k); });
  }
  return keys.map(key => {
    const colonIdx = key.indexOf(':');
    return { type: key.slice(0, colonIdx) === 'n' ? 'node' : 'sec', id: key.slice(colonIdx + 1), key };
  });
}

// Sort L4 structural children of a node by stored order
function sortedL4Children(nodeId, children) {
  const order = S.l4ChildOrder[nodeId];
  if (!order || !children) return children;
  return [...children].sort((a,b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    return (ai === -1 ? 99999 : ai) - (bi === -1 ? 99999 : bi);
  });
}

// Sort right-panel articles (L4 leaf or L5) by stored order for a given context id
function sortedR4Arts(ctxId, arts) {
  const filtered = (arts || []).filter(a => !S.suppressedArts[String(a.id)]);
  const order = S.r4ArtOrder[ctxId];
  if (!order) return filtered;
  return [...filtered].sort((a,b) => {
    const ai = order.indexOf(String(a.id)), bi = order.indexOf(String(b.id));
    return (ai === -1 ? 99999 : ai) - (bi === -1 ? 99999 : bi);
  });
}

// Unified sorted list for a chip: cache articles + directArticles, merged by r4ArtOrder
function unifiedChipArts(nodeId) {
  const n = nodeIndex[nodeId];
  const cached = n?.zid ? (S.articleCache[n.zid]||[]).filter(a => !S.suppressedArts[String(a.id)]) : [];
  const direct = (S.directArticles[nodeId]||[]);
  const byId = {};
  [...cached, ...direct].forEach(a => byId[String(a.id)] = a);
  const cacheIds = new Set(cached.map(a => String(a.id)));
  const order = S.r4ArtOrder[nodeId];
  let sorted;
  if (order) {
    sorted = order.map(id => byId[String(id)]).filter(Boolean);
    const inOrder = new Set(order.map(String));
    [...cached, ...direct].forEach(a => { if (!inOrder.has(String(a.id))) sorted.push(a); });
  } else {
    sorted = [...cached, ...direct];
  }
  return sorted.map(a => ({ ...a, _srcType: cacheIds.has(String(a.id)) ? 'cache' : 'direct' }));
}
const nodeIndex = {};
function indexNode(n) {
  nodeIndex[n.id] = n;
  if (n.children) n.children.forEach(indexNode);
}
LEFT.forEach(indexNode);

const rsecIndex = {};
const suiteIndex = {};
RIGHT.forEach(suite => {
  suiteIndex[suite.id] = suite;
  suite.sections.forEach(s => { rsecIndex[s.id] = s; s.suiteColor = suite.color; });
});

// ── Recursive right-panel helpers ─────────────────────────────────────────
function findSecById(secId) {
  for (const suite of RIGHT) {
    function search(arr) {
      for (const s of arr) {
        if (s.id === secId) return s;
        if (s.subsections) { const r = search(s.subsections); if (r) return r; }
      }
      return null;
    }
    const r = search(suite.sections);
    if (r) return r;
  }
  return null;
}

// Removes a section from wherever it lives; returns {sec, parentType:'suite'|'section', parentId, index}
function extractSec(secId) {
  for (const suite of RIGHT) {
    const idx = suite.sections.findIndex(s => s.id === secId);
    if (idx !== -1) {
      const [sec] = suite.sections.splice(idx, 1);
      return { sec, parentType:'suite', parentId:suite.id, index:idx };
    }
    function searchSubs(arr, parentId) {
      for (const s of arr) {
        if (s.subsections) {
          const i = s.subsections.findIndex(x => x.id === secId);
          if (i !== -1) {
            const [sec] = s.subsections.splice(i, 1);
            return { sec, parentType:'section', parentId:s.id, index:i };
          }
          const r = searchSubs(s.subsections, s.id);
          if (r) return r;
        }
      }
      return null;
    }
    const r = searchSubs(suite.sections, suite.id);
    if (r) return r;
  }
  return null;
}

// Restore a section to its original location
function restoreSec(sec, parentType, parentId, index) {
  if (parentType === 'suite') {
    const suite = suiteIndex[parentId];
    if (suite) suite.sections.splice(index, 0, sec);
  } else {
    const parent = findSecById(parentId);
    if (parent) {
      if (!parent.subsections) parent.subsections = [];
      parent.subsections.splice(index, 0, sec);
    }
  }
}

// Place a section as subsection of target, or as L2 in a suite
function placeSec(sec, targetType, targetId) {
  if (targetType === 'suite') {
    const suite = suiteIndex[targetId];
    if (suite) { suite.sections.push(sec); sec.suiteColor = suite.color; }
  } else {
    const target = findSecById(targetId);
    if (target) {
      if (!target.subsections) target.subsections = [];
      target.subsections.push(sec);
    }
  }
}

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  expanded: new Set(),
  selected: new Set(),
  assignments: {},
  directArticles: {},
  sectionOrder: {},    // rightSecId → [nodeId, ...] explicit L3 order
  articleOrder: {},    // zid → [articleId, ...] explicit left-panel article order
  l4ChildOrder: {},    // L3-chip nodeId → [childId, ...] explicit L4 child order
  r4ArtOrder:   {},    // node/childId → [artId, ...] explicit right-panel article order (L4 leaf + L5)
  l2Collapsed:    new Set(),  // secIds currently collapsed
  suiteCollapsed: new Set(),  // suiteIds currently collapsed
  suppressedArts: {},         // artId(string) → true  — suppressed from original Zendesk section
  historyLog:     [],         // [{ts, text}] — movement log entries, mirrors undoStack
  rightExpanded: new Set(),
  undoStack: [],
  redoStack: [],
  articleCache: Object.assign({}, PRELOADED_ARTICLES),
  articlesLoading: new Set()
};

// macOS-style disclosure chevron — points right when collapsed, rotates 90° to point down when expanded
function togIcon(isOpen) {
  return `<svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${isOpen ? 90 : 0}deg);transition:transform .15s ease;flex-shrink:0"><path d="M3 1.3 L6.5 4.5 L3 7.7"/></svg>`;
}

function totalCount(node) {
  if (!node) return 0;
  if (!node.children || !node.children.length) return node.count || 0;
  return node.children.reduce((sum, c) => sum + totalCount(c), 0);
}

// ─── UNDO / REDO ─────────────────────────────────────────────────────────────
// ─── MOVEMENT LOG ────────────────────────────────────────────────────────────
function logEvent(text) {
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const ts = `${p(now.getDate())}/${p(now.getMonth()+1)}/${String(now.getFullYear()).slice(-2)} - ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  S.historyLog.push({ts, text, isEvent: true});
  try { localStorage.setItem(LS_HISTORY_KEY, JSON.stringify(S.historyLog)); } catch(e) {}
  renderHistoryDrawer();
}

function buildLogEntry(actions) {
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const ts = `${p(now.getDate())}/${p(now.getMonth()+1)}/${String(now.getFullYear()).slice(-2)} - ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  const ch = actions[0]; if (!ch) return {ts, text:'Action'};
  function rPath(id) {
    for (const s of RIGHT) {
      if (s.sections.some(x => x.id === id)) return [s.label, rsecIndex[id]?.label || id];
      for (const sec of s.sections) {
        if (sec.subsections?.some(x => x.id === id)) return [s.label, sec.label, rsecIndex[id]?.label || id];
      }
    }
    return null;
  }
  function ctxPath(ctxId) {
    const rp = rPath(ctxId); if (rp) return rp;
    const sid = S.assignments[ctxId]; const n = nodeIndex[ctxId];
    if (sid && n) { const base = rPath(sid); if (base) return [...base, n.label]; }
    return [ctxId];
  }
  function fp(parts) { return (parts||[ctxId]).join(' / '); }
  function posIn(list, id) { const i = list.findIndex(x => String(x) === String(id) || String(x?.id) === String(id)); return i===-1?'?':i+1; }
  function artName(id) {
    for (const arts of Object.values(S.articleCache||{})) { const f = arts?.find(a=>String(a.id)===String(id)); if(f) return f.title; }
    for (const arts of Object.values(S.directArticles||{})) { const f = arts?.find(a=>String(a.id)===String(id)); if(f) return f.title; }
    return String(id);
  }
  if (ch.kind === 'art-move') {
    const title = ch.artObj?.title || artName(ch.artId);
    const fromP = ctxPath(ch._fromCtx || ch.srcCtx);
    const toP   = ctxPath(ch.targetSecId);
    const pos   = posIn(unifiedChipArts(ch.targetSecId), ch.artId);
    return {ts, text:`Moved "${title}" (Article)\n  From: ${fp(fromP)}\n  To: position ${pos} in ${fp(toP)}`};
  }
  if (ch.kind === 'reorder') {
    const oldO = ch.before?.r4ArtOrder || ch.before?.directArts?.map(a=>a.id);
    const newO = ch.after?.r4ArtOrder  || ch.after?.directArts?.map(a=>a.id);
    const isArt = ch.type==='direct-art'||ch.type==='l4a'||ch.type==='l5a';
    const name  = isArt ? artName(ch.itemId) : (nodeIndex[ch.itemId]?.label||rsecIndex[ch.itemId]?.label||ch.itemId);
    return {ts, text:`Reordered "${name}" (${isArt?'Article':'Section'}) to ${posIn(newO||[],ch.itemId)} from ${posIn(oldO||[],ch.itemId)} in ${fp(ctxPath(ch.contextId))}`};
  }
  if (ch.kind === 'rename') {
    const path = ctxPath(ch.id);
    return {ts, text:`Renamed "${ch.from}" → "${ch.to}" (Section)\n  At: ${fp(path.length>1?path.slice(0,-1):path)}`};
  }
  if (ch.kind === 'remove-l2-sec') {
    return {ts, text:`Removed "${ch.secObj?.label||ch.secId}" (Section)\n  From: ${RIGHT.find(s=>s.id===ch.suiteId)?.label||ch.suiteId}`};
  }
  if (ch.kind === 'remove-subsec') {
    return {ts, text:`Removed "${ch.secObj?.label||ch.subId}" (Section)\n  From: ${fp(rPath(ch.parentId)||[ch.parentId])}`};
  }
  if (ch.kind === 'promote-assigned') {
    return {ts, text:`Promoted "${nodeIndex[ch.nodeId]?.label||ch.nodeId}" (Section)\n  To suite: ${RIGHT.find(s=>s.id===ch.targetSuiteId)?.label||ch.targetSuiteId}`};
  }
  if (ch._logData) return {ts, text: ch._logData.text};
  const lbls = {'flatten-snapshot':'Reorganized sections','art-snap':'Moved articles','sec-nest':'Moved section'};
  return {ts, text: lbls[ch.kind]||ch.kind};
}

function buildUndoLogEntry(changes) {
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const ts = `${p(now.getDate())}/${p(now.getMonth()+1)}/${String(now.getFullYear()).slice(-2)} - ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  const ch = changes[0]; if (!ch) return {ts, text:'Undone', isEvent:true};

  // Reuse helpers from buildLogEntry scope
  function rPath(id) { for(const s of RIGHT){if(s.sections.some(x=>x.id===id))return[s.label,rsecIndex[id]?.label||id];for(const sec of s.sections){if(sec.subsections?.some(x=>x.id===id))return[s.label,sec.label,rsecIndex[id]?.label||id];}}return null; }
  function ctxPath(ctxId) { const rp=rPath(ctxId);if(rp)return rp;const sid=S.assignments[ctxId];const n=nodeIndex[ctxId];if(sid&&n){const base=rPath(sid);if(base)return[...base,n.label];}return[ctxId]; }
  function fp(parts) { return(parts||[]).join(' / '); }
  function posIn(list,id) { const i=list.findIndex(x=>String(x)===String(id)||String(x?.id)===String(id));return i===-1?'?':i+1; }
  function artName(id) { for(const arts of Object.values(S.articleCache||{})){const f=arts?.find(a=>String(a.id)===String(id));if(f)return f.title;} for(const arts of Object.values(S.directArticles||{})){const f=arts?.find(a=>String(a.id)===String(id));if(f)return f.title;} return String(id); }

  if (ch.kind === 'reorder') {
    // Swap before/after positions
    const oldO = ch.before?.r4ArtOrder || ch.before?.directArts?.map(a=>a.id);
    const newO = ch.after?.r4ArtOrder  || ch.after?.directArts?.map(a=>a.id);
    const isArt = ch.type==='direct-art'||ch.type==='l4a'||ch.type==='l5a';
    const name  = isArt ? artName(ch.itemId) : (nodeIndex[ch.itemId]?.label||rsecIndex[ch.itemId]?.label||ch.itemId);
    return {ts, text:`Reordered "${name}" (${isArt?'Article':'Section'}) to ${posIn(oldO||[],ch.itemId)} from ${posIn(newO||[],ch.itemId)} in ${fp(ctxPath(ch.contextId))}`, isEvent:true};
  }
  if (ch.kind === 'art-move') {
    const title  = ch.artObj?.title || artName(ch.artId);
    const fromP  = ctxPath(ch.targetSecId);
    const toP    = ctxPath(ch.srcCtx);
    return {ts, text:`Moved "${title}" (Article)\n  From: ${fp(fromP)}\n  To: ${fp(toP)}`, isEvent:true};
  }
  if (ch.kind === 'rename') {
    const path = ctxPath(ch.id);
    return {ts, text:`Renamed "${ch.to}" → "${ch.from}" (Section)\n  At: ${fp(path.length>1?path.slice(0,-1):path)}`, isEvent:true};
  }
  if (ch.kind === 'remove-l2-sec' || ch.kind === 'remove-subsec') {
    const lbl = ch.secObj?.label || ch.secId || ch.subId;
    return {ts, text:`Restored "${lbl}" (Section)`, isEvent:true};
  }
  if (ch.kind === 'promote-assigned') {
    return {ts, text:`Reverted promotion of "${nodeIndex[ch.nodeId]?.label||ch.nodeId}" (Section)`, isEvent:true};
  }
  // Fallback
  const entry = buildLogEntry(changes);
  return {ts, text:`Undone: ${entry.text.split('\n')[0]}`, isEvent:true};
}

function buildRedoLogEntry(changes) {
  // Redo re-applies the original action — same description as the original
  const entry = buildLogEntry(changes);
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const ts = `${p(now.getDate())}/${p(now.getMonth()+1)}/${String(now.getFullYear()).slice(-2)} - ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;

}
function pushAction(changes) {

  S.historyLog.push(buildLogEntry(changes));

}
function undo() {
  if (!S.undoStack.length) return;
  const changes = S.undoStack.pop();
  S.redoStack.push(changes);
  changes.forEach(ch => {
    if (ch.kind === 'flatten-snapshot') {
      const asgn  = ch.beforeAssignments  ?? ch.before?.assignments;
      const darts = ch.beforeDirectArts   ?? ch.before?.directArts;
      const sord  = ch.before?.sectionOrder;
      const rstr  = ch.before?.rightStructure;
      if (asgn  != null) S.assignments    = {...asgn};
      if (darts != null) S.directArticles = {...darts};
      if (sord  != null) S.sectionOrder   = {...sord};
      if (rstr)          RIGHT.splice(0, RIGHT.length, ...rstr);
    } else if (ch.kind === 'art-snap') {
      S.directArticles[ch.secId] = ch.before.length ? [...ch.before] : undefined;
      if (!S.directArticles[ch.secId]) delete S.directArticles[ch.secId];
    } else if (ch.kind === 'rename') {
      const obj = nodeIndex[ch.id] || rsecIndex[ch.id];
      if (obj) obj.label = ch.from;
    } else if (ch.kind === 'reorder') {
      if (ch.type === 'l2') {
        const suite = suiteIndex[ch.contextId];
        if (suite && ch.before.l2) suite.sections.sort((a,b) => ch.before.l2.indexOf(a.id) - ch.before.l2.indexOf(b.id));
      } else if (ch.type === 'l3u' || ch.type === 'l3') {
        if (ch.before.sectionOrder) {
          S.sectionOrder[ch.contextId] = [...ch.before.sectionOrder];
          // Also restore subsections order
          const sec = rsecIndex[ch.contextId];
          if (sec?.subsections) {
            const subOrder = ch.before.sectionOrder.filter(k => k.startsWith('s:')).map(k => k.slice(2));
            if (subOrder.length) sec.subsections.sort((a,b) => subOrder.indexOf(a.id) - subOrder.indexOf(b.id));
          }
        } else delete S.sectionOrder[ch.contextId];
      } else if (ch.type === 'direct-art') {
        if (ch.before.directArts) S.directArticles[ch.contextId] = [...ch.before.directArts];
        else delete S.directArticles[ch.contextId];
      } else if (ch.type === 'l4c') {
        if (ch.before.l4ChildOrder) S.l4ChildOrder[ch.contextId] = [...ch.before.l4ChildOrder];
        else delete S.l4ChildOrder[ch.contextId];
      } else if (ch.type === 'l4a' || ch.type === 'l5a') {
        if (ch.before.r4ArtOrder) S.r4ArtOrder[ch.contextId] = [...ch.before.r4ArtOrder];
        else delete S.r4ArtOrder[ch.contextId];
      } else if (ch.type === 'article') {
        if (ch.before.articleOrder) S.articleOrder[ch.contextId] = [...ch.before.articleOrder];
        else delete S.articleOrder[ch.contextId];
      }
    } else if (ch.kind === 'art-move') {
      S.directArticles[ch.targetSecId] = (S.directArticles[ch.targetSecId]||[]).filter(a => String(a.id) !== ch.artId);
      if (!S.directArticles[ch.targetSecId]?.length) delete S.directArticles[ch.targetSecId];
      if (ch.srcType === 'direct') {
        S.directArticles[ch.srcCtx] = [...(S.directArticles[ch.srcCtx]||[]), ch.artObj];
      } else { delete S.suppressedArts[ch.artId]; }
    } else if (ch.kind === 'remove-subsec') {
      const parent = rsecIndex[ch.parentId];
      if (parent) { parent.subsections = parent.subsections || []; parent.subsections.splice(ch.atIndex, 0, ch.secObj); rsecIndex[ch.subId] = ch.secObj; }
      const suite = RIGHT.find(s => s.id === ch.suiteId);
      if (suite) { suite.sections.splice(ch.atIndex, 0, ch.secObj); rsecIndex[ch.secId] = ch.secObj; }
    } else if (ch.kind === 'promote-assigned') {

      else delete S.assignments[ch.nodeId];

  const _undoneEntry = buildUndoLogEntry(changes);

}

    } else if (ch.kind === 'remove-l2-sec') {

function renderHistoryDrawer() {
  const drawer = document.getElementById('history-drawer');
  if (!drawer.classList.contains('open')) return;
  const total    = S.historyLog.filter(e => !e.isEvent).length;
  const pos      = S.undoStack.length;
  document.getElementById('history-pos').textContent = `${pos} / ${total}`;
  document.getElementById('hbtn-prev').disabled = pos === 0;
  document.getElementById('hbtn-next').disabled = !S.redoStack.length;
  const list = document.getElementById('history-list');
  if (S.historyLog.length === 0) { list.innerHTML = '<div style="padding:14px;color:#bbb;font-size:11px;text-align:center">No actions yet</div>'; return; }
  let actionCount = 0;
  const totalActions = S.historyLog.filter(e => !e.isEvent).length;
  list.innerHTML = [...S.historyLog].reverse().map(entry => {
    if (entry.isEvent) {
      return `<div class="hentry event"><span class="hts">${entry.ts}</span><span class="htext">${entry.text}</span></div>`;
    }
    const forwardIdx = totalActions - actionCount;
    actionCount++;
    const isCurrent = forwardIdx === pos;
    const cls = isCurrent ? 'hentry current' : 'hentry';
    return `<div class="${cls}"><span class="hts">${entry.ts}</span><span class="htext">${entry.text}</span></div>`;
  }).join('');
  // No auto-scroll — user controls scroll position
}

async function fetchArticles(node, silent = false) {
  if (!node.zid || S.articlesLoading.has(node.id) || S.articleCache[node.zid] !== undefined) return;
  S.articlesLoading.add(node.id);
  if (!silent) renderLeft();
  try {
    const base = `https://support.appsflyer.com/api/v2/help_center/en-us/sections/${node.zid}/articles.json?per_page=100&sort_by=position`;
    const resp = await fetch(base);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    let arts = (data.articles || []).filter(a => !a.draft).map(a => ({ id: a.id, title: a.title, url: a.html_url }));
    if (data.next_page) {
      const r2 = await fetch(data.next_page);
      const d2 = await r2.json();
      arts = arts.concat((d2.articles || []).filter(a => !a.draft).map(a => ({ id: a.id, title: a.title, url: a.html_url })));
    }
    S.articleCache[node.zid] = arts;
  } catch(err) {
    S.articleCache[node.zid] = null; // null = failed
  }
  S.articlesLoading.delete(node.id);
  if (!silent) renderLeft();
}

async function preloadAllArticles() {
  const leafNodes = [];
  function collect(node) {
    if (node.zid && !(node.children && node.children.length)) leafNodes.push(node);
    if (node.children) node.children.forEach(collect);
  }
  LEFT.forEach(cat => cat.children && cat.children.forEach(collect));

  const total = leafNodes.length;
  let done = 0;
  const BATCH = 8;
  for (let i = 0; i < leafNodes.length; i += BATCH) {
    await Promise.all(leafNodes.slice(i, i + BATCH).map(async n => {
      await fetchArticles(n, true);
      done++;
    }));
    if (done < total) flashStatus(`Loading articles… ${done}/${total}`);
  }
  flashStatus(`✓ ${total} sections loaded`);
  renderLeft();
}

}

function renderLeft() {
  const lines = [];
  LEFT.forEach(cat => {
    lines.push(`<div class="cat-label">${cat.label}</div>`);
    cat.children.forEach(child => renderLeftNode(child, 0, null, lines));
  });
  document.getElementById('ltree').innerHTML = `<div class="col-inner" id="ltree-inner">${lines.join('')}</div>`;
  applyZoom();
  attachLeftEvents();
}

function renderLeftNode(node, depth, parentColor, lines) {
  const color = node.color || parentColor || '';
  const expanded = S.expanded.has(node.id);
  const selected = S.selected.has(node.id);
  const assigned = S.assignments[node.id];
  const hasChildren = node.children && node.children.length > 0;
  const isLeaf = !hasChildren;
  const isDraggable = node.type === 'sec' || node.type === 'sub' || node.type === 'subsub';
  const pl = 8 + depth * 14;

  const isExpandable = hasChildren || (node.count && node.count > 0);
  const togHtml = isExpandable
    ? `<span class="tog" data-tog="${node.id}">${togIcon(expanded)}</span>`
    : `<span class="tog placeholder">·</span>`;

  const assignTag = assigned
    ? `<span class="assign-tag" title="${rsecIndex[assigned]?.label || assigned}">→ ${(rsecIndex[assigned]?.label || assigned).substring(0,18)}${(rsecIndex[assigned]?.label||'').length>18?'…':''}</span>`
    : '';

  const rowClasses = ['node-row', isDraggable?'draggable':'', selected?'selected':'', assigned?'assigned':''].filter(Boolean).join(' ');

  lines.push(
    `<div class="tree-node" id="tn-${node.id}">` +
    `<div class="${rowClasses}" style="padding-left:${pl}px" data-id="${node.id}" data-draggable="${isDraggable?1:0}">` +
    togHtml +
    `<div class="chip ${color}"><span class="lbl">${node.label}</span>${node.count!=null?`<span class="cnt">${node.count}</span>`:''}</div>` +
    assignTag +
    `</div>`
  );

  if (expanded) {
    if (hasChildren) {
      node.children.forEach(child => {
        renderLeftNode(child, depth + 1, color, lines);
      });
    }
    if (node.zid) {
      if (S.articlesLoading.has(node.id)) {
        if (!hasChildren) lines.push(`<div class="art-loading" style="padding-left:${pl+28}px">⏳ Loading articles…</div>`);
      } else {
        const cached = sortedArticles(node.zid);
        if (cached && cached.length > 0) {
          // Articles shown at same level as structural children
          cached.forEach(a => {
            lines.push(`<div class="art-row" style="padding-left:${pl+28}px" data-art='${JSON.stringify({id:a.id,title:a.title,url:a.url})}' data-zid="${node.zid}" data-art-id="${a.id}"><span class="grip">⠿</span><a href="${a.url}" target="_blank" class="art-link">${a.title}</a></div>`);
          });
        } else if (!hasChildren) {
          if (cached && cached.length === 0) {
            lines.push(`<div class="art-loading" style="padding-left:${pl+28}px">No articles found</div>`);
          } else if (cached === null) {
            lines.push(`<div class="art-loading" style="padding-left:${pl+28}px">⚠ Could not load articles</div>`);
          } else if (node.count) {
            lines.push(`<div class="art-count" style="padding-left:${pl+28}px">📄 ${node.count} articles</div>`);
          }
        }
      }
    } else if (!hasChildren && node.count) {
      lines.push(`<div class="art-count" style="padding-left:${pl+28}px">📄 ${node.count} articles</div>`);
    }
  }

  lines.push(`</div>`);
}

function renderSubsections(subsections, lines, suite, depth, parentSecId) {
  const chipLv    = `l${depth + 2}`;   // L3 at depth=1, L4 at depth=2
  const contentLv = `l${depth + 3}`;   // L4 at depth=1, L5 at depth=2
  subsections.forEach(sub => {
    const subAssigned   = Object.entries(S.assignments).filter(([,v]) => v === sub.id);
    const subDirectArts = S.directArticles[sub.id];
    const subCnt = subAssigned.length
      ? subAssigned.reduce((s,[id]) => s + (nodeIndex[id]?.count||0), 0)
      : subDirectArts ? subDirectArts.length : null;
    const subIsOpen = S.rightExpanded.has(sub.id);
    lines.push(
      `<div class="rsec-row ${chipLv}" id="rsec-${sub.id}" data-rsec="${sub.id}" data-sec-type="subsec" data-sec-parent="${parentSecId}" data-sec-suite="${suite.id}">` +
      `<span class="grip" data-sec-grip="${sub.id}" data-sec-type="subsec" data-sec-parent="${parentSecId}" data-sec-suite="${suite.id}" data-sec-label="${sub.label.replace(/"/g,'&quot;')}" data-reorder-l3-key="s:${sub.id}" data-reorder-l3-ctx="${parentSecId}">⠿</span>` +
      `<span class="r-tog" data-r-tog="${sub.id}">${togIcon(subIsOpen)}</span>` +
      `<div class="rsec-chip ${suite.color}" style="opacity:${Math.max(0.6, 0.9 - depth*0.1)};border-left:2px solid rgba(0,0,0,.12)"><span class="lbl">${sub.label}</span>${subCnt?`<span class="cnt">${subCnt}</span>`:''}</div>` +
      `<span class="promote-btn" data-promote="${sub.id}" title="Promote to L2">↑</span>` +
      `<span class="remove-btn" data-remove-subsec="${sub.id}" data-parent-sec="${parentSecId}" title="Remove subsection">×</span>` +
      `</div>`
    );
    if (subIsOpen) {
      if (subAssigned.length) {
        const artLv = `l${Math.min(depth + 4, 5)}`;  // articles one level deeper than contentLv
        subAssigned.forEach(([id]) => {
          const n = nodeIndex[id]; if (!n) return;
          const isSec        = (n.type === 'sec' || n.type === 'sub') && n.children?.length > 0;
          const cachedArts   = n.zid ? S.articleCache[n.zid] : null;
          const hasArticles  = cachedArts && cachedArts.length > 0;
          const isPlanned    = !isSec && !hasArticles && n.count > 0;
          const isExpandable = isSec || hasArticles || isPlanned;
          const isOpen       = S.rightExpanded.has(id);
          const tc           = n.count || 0;

          if (isExpandable) {
            lines.push(
              `<div class="assigned-sec-header ${contentLv}" data-assigned-id="${id}">` +
              `<span class="grip" data-sec-grip="${id}" data-sec-type="assigned" data-sec-parent="${S.assignments[id]}" data-sec-suite="${suite.id||''}" data-sec-label="${n.label.replace(/"/g,'&quot;')}" data-reorder-l3-key="n:${id}" data-reorder-l3-ctx="${S.assignments[id]||''}">⠿</span>` +
              `<span class="r-tog" data-r-tog="${id}">${isPlanned ? `<span style="font-size:13px;line-height:1">${isOpen?'−':'+'}</span>` : togIcon(isOpen)}</span>` +
              `<div class="assigned-chip"><span class="lbl">${n.label}</span>${tc?`<span class="cnt">${tc}</span>`:''}</div>` +
              `<span class="promote-btn" data-promote-assigned="${id}" title="Promote to L2">↑</span>` +
              `<span class="remove-btn" data-remove="${id}" title="Unassign">×</span>` +
              `</div>`
            );
            if (isOpen) {
              if (isSec) {
                const orderedChildren = sortedL4Children(n.id, n.children);
                const multiChild = orderedChildren.length > 1;
                orderedChildren.forEach(child => {
                  const childCount   = totalCount(child);
                  const childArts    = child.zid ? S.articleCache[child.zid]
                    : child.articleIds && child.parentZid
                      ? (S.articleCache[child.parentZid]||[]).filter(a => child.articleIds.includes(a.id))
                      : null;
                  const filteredCArts = sortedR4Arts(child.id, childArts);
                  const childHasArts = filteredCArts && filteredCArts.length > 0;
                  const childIsOpen  = S.rightExpanded.has(child.id);
                  const l4Grip       = multiChild ? `<span class="grip" data-reorder-l4c="${child.id}" data-l4c-ctx="${n.id}">⠿</span>` : '';
                  lines.push(
                    `<div class="sec-child-row ${artLv}" data-grip-id="${child.id}" style="cursor:pointer">` +
                    l4Grip +
                    `<span class="r-tog" data-r-tog="${child.id}" style="margin-right:4px">${togIcon(childIsOpen)}</span>` +
                    `<span class="lbl">${child.label}</span>` +
                    `${childCount?`<span class="cnt">${childCount}</span>`:''}</div>`
                  );
                  if (childIsOpen && childHasArts) {
                    filteredCArts.forEach(a => {
                      lines.push(`<div class="sec-child-row l5" data-art-id="${a.id}" data-art-src-type="cache" data-art-src-ctx="${child.id}" data-grip-id="${a.id}"><span class="grip" data-art-grip="${a.id}" data-art-ctx="${child.id}" data-art-src-type="cache" data-art-level="l5" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span><a href="${a.url}" target="_blank" class="art-link">${a.title}</a></div>`);
                    });
                  }
                  // Manually moved-in articles at L5
                  if (childIsOpen) {
                    (S.directArticles[child.id]||[]).forEach(a => {
                      lines.push(`<div class="sec-child-row l5" data-art-id="${a.id}" data-art-src-type="direct" data-art-src-ctx="${child.id}" data-grip-id="${a.id}"><span class="grip" data-art-grip="${a.id}" data-art-ctx="${child.id}" data-art-src-type="direct" data-art-level="l5" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span><a href="${a.url}" target="_blank" class="art-link">${a.title}</a></div>`);
                    });
                  }
                });
              } else if (hasArticles) {
                const sortedArts = sortedR4Arts(n.id, cachedArts);
                sortedArts.forEach(a => {
                  lines.push(
                    `<div class="sec-child-row ${artLv}" data-art-id="${a.id}" data-art-src-type="cache" data-art-src-ctx="${n.id}" data-grip-id="${a.id}">` +
                    `<span class="grip" data-art-grip="${a.id}" data-art-ctx="${n.id}" data-art-src-type="cache" data-art-level="${artLv}" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span>` +
                    `<a href="${a.url}" target="_blank" class="art-link">${a.title}</a></div>`
                  );
                });
              } else if (isPlanned) {
                lines.push(`<div class="sec-child-row ${artLv}" style="font-style:italic;color:#bbb">📄 ${tc} article${tc>1?'s':''} — section to be created in Zendesk</div>`);
              }
            }
          } else {
            // Truly flat node — no articles, no children
            lines.push(
              `<div class="assigned-item ${contentLv}" data-assigned-id="${id}">` +
              `<span class="grip" data-sec-grip="${id}" data-sec-type="assigned" data-sec-parent="${S.assignments[id]}" data-sec-suite="${suite.id||''}" data-sec-label="${n.label.replace(/"/g,'&quot;')}" data-reorder-l3-key="n:${id}" data-reorder-l3-ctx="${S.assignments[id]||''}">⠿</span>` +
              `<div class="assigned-chip"><span class="lbl">${n.label}</span>${tc?`<span class="cnt">${tc}</span>`:''}</div>` +
              `<span class="promote-btn" data-promote-assigned="${id}" title="Promote to L2">↑</span>` +
              `<span class="remove-btn" data-remove="${id}" title="Unassign">×</span>` +
              `</div>`
            );
          }
        });
      } else if (subDirectArts && subDirectArts.length) {
        subDirectArts.forEach(a => {
          lines.push(`<div class="sec-child-row ${contentLv}" data-art-id="${a.id}" data-art-src-type="direct" data-art-src-ctx="${sub.id}"><a href="${a.url}" target="_blank" class="art-link">${a.title}</a></div>`);
        });
      } else {
        lines.push(`<div class="drop-hint ${contentLv}">Drop here</div>`);
      }
      if (sub.subsections && sub.subsections.length) {
        renderSubsections(sub.subsections, lines, suite, depth + 1, sub.id);
      }
    }
  });
}

function renderRight() {
  const lines = [];
  RIGHT.forEach(suite => {
    lines.push(`<div class="suite-block ${suite.color}" data-suite-id="${suite.id}">`);
    const isSuiteCollapsed = S.suiteCollapsed.has(suite.id);
    lines.push(
      `<div class="suite-label" style="display:flex;align-items:center;gap:5px;cursor:pointer" data-suite-tog="${suite.id}">` +
      `<span class="r-tog" style="opacity:.75">${togIcon(!isSuiteCollapsed)}</span>` +
      `${suite.label}` +
      `</div>`
    );
    if (!isSuiteCollapsed) {
    suite.sections.forEach(sec => {
      const l3Items    = getUnifiedL3Items(sec.id);
      const assigned   = sortedAssigned(sec.id);
      const directArts = S.directArticles[sec.id];
      const cnt = assigned.length
        ? assigned.reduce((sum,[id])=>sum+(nodeIndex[id]?.count||0),0)
        : directArts ? directArts.length : null;
      const isL2Collapsed = S.l2Collapsed.has(sec.id);
      lines.push(
        `<div class="rsec-row l2" id="rsec-${sec.id}" data-rsec="${sec.id}" data-sec-type="l2sec" data-sec-suite="${suite.id}">` +
        `<span class="grip" data-sec-grip="${sec.id}" data-sec-type="l2sec" data-sec-suite="${suite.id}" data-sec-label="${sec.label.replace(/"/g,'&quot;')}" data-reorder-l2="${sec.id}" data-suite="${suite.id}">⠿</span>` +
        `<span class="r-tog" data-l2-tog="${sec.id}">${togIcon(!isL2Collapsed)}</span>` +
        `<div class="rsec-chip ${suite.color}"><span class="lbl">${sec.label}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}</div>` +
        `<span class="remove-btn" data-remove-l2="${sec.id}" title="Remove section">×</span>` +
        `</div>`
      );
      if (!isL2Collapsed) {
      if (l3Items.length) {
        const isRedundant = l3Items.length === 1;
        l3Items.forEach(item => {
          if (item.type === 'node') {
            const id = item.id;
            const n = nodeIndex[id]; if (!n) return;
          const isSec      = (n.type === 'sec' || n.type === 'sub') && n.children && n.children.length > 0;
          const cachedArts = n.zid ? S.articleCache[n.zid] : null;
          const hasArticles = cachedArts && cachedArts.length > 0;
          const isPlanned  = !isSec && !hasArticles && n.count > 0;
          const isExpandable = isSec || hasArticles || isPlanned;
          const isRedundant  = l3Items.length === 1 && item.type === 'node';
          const chipCls = `assigned-chip ${n.color||''} ${isRedundant ? 'redundant' : ''}`.trim();

          if (isExpandable) {
            // Expandable L3: ▸/▾ toggle, redundant nodes shown with dashed italic style
            const isOpen = S.rightExpanded.has(id);
            const tc = totalCount(n);
            lines.push(
              `<div class="assigned-sec-header l3" data-assigned-id="${id}">` +
              `<span class="grip" data-sec-grip="${id}" data-sec-type="assigned" data-sec-parent="${S.assignments[id]}" data-sec-suite="${suite.id||''}" data-sec-label="${n.label.replace(/"/g,'&quot;')}" data-reorder-l3-key="n:${id}" data-reorder-l3-ctx="${S.assignments[id] || ''}">⠿</span>` +
              `<span class="r-tog" data-r-tog="${id}">${isPlanned ? `<span style="font-size:13px;line-height:1">${isOpen ? '−' : '+'}</span>` : togIcon(isOpen)}</span>` +
              `<div class="${chipCls}"><span class="lbl">${n.label}</span>${tc?`<span class="cnt">${tc}</span>`:''}</div>` +
              `<span class="promote-btn" data-promote-assigned="${id}" title="Promote to L2">↑</span>` +
              `<span class="remove-btn" data-remove="${id}" title="Unassign">×</span>` +
              `</div>`
            );
            if (isOpen) {
              lines.push(`<div class="assigned-sec-children">`);
              if (isSec) {
                const orderedChildren = sortedL4Children(n.id, n.children);
                const multiChild = orderedChildren.length > 1;
                orderedChildren.forEach(child => {
                  const childCount = totalCount(child);
                  const childArts = child.zid
                    ? S.articleCache[child.zid]
                    : child.articleIds && child.parentZid
                      ? (S.articleCache[child.parentZid] || []).filter(a => child.articleIds.includes(a.id))
                      : null;
                  const childHasArts = childArts && childArts.length > 0;
                  const childIsOpen  = S.rightExpanded.has(child.id);
                  const sortedCArts  = sortedR4Arts(child.id, childArts);
                  const multiL5      = sortedCArts && sortedCArts.length > 1;
                  const l4Grip       = multiChild
                    ? `<span class="grip" data-reorder-l4c="${child.id}" data-l4c-ctx="${n.id}">⠿</span>`
                    : '';

                  if (childHasArts) {
                    lines.push(
                      `<div class="sec-child-row l4" data-grip-id="${child.id}" style="cursor:pointer">` +
                      l4Grip +
                      `<span class="r-tog" data-r-tog="${child.id}" style="margin-right:4px">${togIcon(childIsOpen)}</span>` +
                      `<span class="lbl">${child.label}</span>` +
                      `${childCount ? `<span class="cnt">${childCount}</span>` : ''}` +
                      `</div>`
                    );
                    if (childIsOpen) {
                      sortedCArts.forEach(a => {
                        lines.push(
                          `<div class="sec-child-row l5" data-art-id="${a.id}" data-art-src-type="cache" data-art-src-ctx="${child.id}" data-grip-id="${a.id}">` +
                          `<span class="grip" data-art-grip="${a.id}" data-art-ctx="${child.id}" data-art-src-type="cache" data-art-level="l5" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span>` +
                          `<a href="${a.url}" target="_blank" class="art-link">${a.title}</a>` +
                          `</div>`
                        );
                      });
                    }
                  } else {
                    lines.push(
                      `<div class="sec-child-row l4" data-grip-id="${child.id}" style="cursor:pointer">` +
                      l4Grip +
                      `<span class="r-tog" data-r-tog="${child.id}" style="margin-right:4px">${togIcon(childIsOpen)}</span>` +
                      `<span class="lbl">${child.label}</span>` +
                      `${childCount ? `<span class="cnt">${childCount}</span>` : ''}` +
                      `</div>`
                    );
                    if (childIsOpen) {
                      lines.push(
                        `<div class="sec-child-row l5" style="font-style:italic;color:#bbb">` +
                        `📄 ${childCount || 0} articles — section to be created in Zendesk` +
                        `</div>`
                      );
                    }
                  }
                });
              } else if (isPlanned) {
                lines.push(
                  `<div class="sec-child-row l4" style="font-style:italic;color:#bbb">` +
                  `📄 ${n.count} article${n.count>1?'s':''} — section to be created in Zendesk` +
                  `</div>`
                );
              } else {
                // Unified list: cache + directArticles, merged by r4ArtOrder
                unifiedChipArts(n.id).forEach(a => {
                  lines.push(
                    `<div class="sec-child-row l4" data-art-id="${a.id}" data-art-src-type="${a._srcType}" data-art-src-ctx="${n.id}" data-grip-id="${a.id}">` +
                    `<span class="grip" data-art-grip="${a.id}" data-art-ctx="${n.id}" data-art-src-type="${a._srcType}" data-art-level="l4" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span>` +
                    `<a href="${a.url}" target="_blank" class="art-link">${a.title}</a>` +
                    `</div>`
                  );
                });
              }
              lines.push(`</div>`);
            }
          } else {
            // Non-expandable flat chip
            lines.push(
              `<div class="assigned-item l3" data-assigned-id="${id}">` +
              `<span class="grip" data-sec-grip="${id}" data-sec-type="assigned" data-sec-parent="${S.assignments[id]}" data-sec-suite="${suite.id||''}" data-sec-label="${n.label.replace(/"/g,'&quot;')}" data-reorder-l3-key="n:${id}" data-reorder-l3-ctx="${S.assignments[id] || ''}">⠿</span>` +
              `<div class="${chipCls}"><span class="lbl">${n.label}</span>${n.count!=null?`<span class="cnt">${n.count}</span>`:''}</div>` +
              `<span class="promote-btn" data-promote-assigned="${id}" title="Promote to L2">↑</span>` +
              `<span class="remove-btn" data-remove="${id}" title="Unassign">×</span>` +
              `</div>`
            );
          }
          } else {
            // Subsection chip — render inline via renderSubsections for one item
            const sub = findSecById(item.id); if (!sub) return;
            renderSubsections([sub], lines, suite, 1, sec.id);
          }
        });
        // Also render any manually moved-in articles at L3 (alongside chips)
        if (directArts && directArts.length) {
          unifiedChipArts(sec.id).forEach(a => {
            lines.push(
              `<div class="sec-child-row l3" data-art-id="${a.id}" data-art-src-type="direct" data-art-src-ctx="${sec.id}">` +
              `<span class="grip" data-art-grip="${a.id}" data-art-ctx="${sec.id}" data-art-src-type="direct" data-art-level="l3" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span>` +
              `<span class="tog-spacer"></span>` +
              `<a href="${a.url}" target="_blank" class="art-link">${a.title}</a>` +
              `</div>`
            );
          });
        }
      } else if (directArts && directArts.length) {
        // No assigned chips — section contains only promoted/moved articles
        unifiedChipArts(sec.id).forEach(a => {
          lines.push(
            `<div class="sec-child-row l3" data-art-id="${a.id}" data-art-src-type="direct" data-art-src-ctx="${sec.id}">` +
            `<span class="grip" data-art-grip="${a.id}" data-art-ctx="${sec.id}" data-art-src-type="direct" data-art-level="l3" data-art-title="${a.title.replace(/"/g,'&quot;')}">⠿</span>` +
            `<span class="tog-spacer"></span>` +
            `<a href="${a.url}" target="_blank" class="art-link">${a.title}</a>` +
            `</div>`
          );
        });
      } else {
        lines.push(`<div class="drop-hint l3">Drop here</div>`);
      }
      } // end if (!isL2Collapsed)
    }); // end sections.forEach
    } // end if (!isSuiteCollapsed)
    lines.push(`</div>`); // close suite-block
  });
  document.getElementById('rtree').innerHTML = `<div class="col-inner" id="rtree-inner">${lines.join('')}</div>`;
  applyZoom();
  attachRightEvents();
}

function render() {
  renderLeft();
  renderRight();
  syncCollapseAll();
}

function syncCollapseAll() {
  const cb = document.getElementById('collapse-all-cb');
  if (cb) cb.checked = RIGHT.length > 0 && S.suiteCollapsed.size === RIGHT.length;
}

function initCollapseAll() {
  const cb = document.getElementById('collapse-all-cb');
  if (!cb) return;
  cb.addEventListener('change', () => {
    if (cb.checked) {
      RIGHT.forEach(suite => S.suiteCollapsed.add(suite.id));
    } else {
      S.suiteCollapsed.clear();
      S.l2Collapsed.clear();
    }
    autoSave();
    render();
  });
}

// ─── LEFT EVENTS ─────────────────────────────────────────────────────────────
function attachLeftEvents() {
  // Toggle expand
  document.querySelectorAll('#ltree .tog[data-tog]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.tog;
      if (S.expanded.has(id)) {
        S.expanded.delete(id);
      } else {
        S.expanded.add(id);
        const node = nodeIndex[id];
        if (node && node.zid && !(node.children && node.children.length) && S.articleCache[node.zid] === undefined && !S.articlesLoading.has(id)) {
          fetchArticles(node);
        }
      }
      renderLeft();
    });
  });

  // Select (click) + drag (move after click)
  document.querySelectorAll('#ltree .node-row[data-draggable="1"]').forEach(el => {
    el.addEventListener('mousedown', e => {
      if (e.target.closest('.tog[data-tog]')) return;
      const id = el.dataset.id;
      if (!e.ctrlKey && !e.metaKey) {
        // plain click: select only this item (unless already in a multi-selection being dragged)
        S.selected.clear();
        S.selected.add(id);
      } else {
        // ctrl/cmd click: toggle
        S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id);
      }
      updateSelBadge();
      renderLeft();
      if (S.selected.size > 0) prepareDrag(e, [...S.selected], false);
    });
  });

  // Article reorder via grip handle
  document.querySelectorAll('#ltree .grip[data-reorder-l2], #ltree .art-row .grip').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault();
      const row  = el.closest('.art-row[data-zid]');
      if (!row) return;
      const zid   = parseInt(row.dataset.zid);
      const artId = parseInt(row.dataset.artId);
      const arts  = sortedArticles(zid);
      if (!arts) return;
      prepareDrag(e, [], false, null, null, {type:'article', itemId:artId, contextId:zid});
    });
  });
  document.querySelectorAll('#ltree .art-row[data-art]').forEach(el => {
    el.addEventListener('mousedown', e => {
      if (e.target.tagName === 'A') return; // allow normal link clicks
      try {
        const article = JSON.parse(el.dataset.art);
        prepareDrag(e, [], false, article);
      } catch(err) {}
    });
  });
}

// ─── RIGHT EVENTS ────────────────────────────────────────────────────────────
function attachRightEvents() {
  document.querySelectorAll('#rtree .remove-btn[data-remove]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.remove;
      const from = S.assignments[id];
      delete S.assignments[id];
      S.rightExpanded.delete(id);
      pushAction([{id, from, to: null}]);
      render();
      flashStatus('Unassigned');
    });
  });

  // Toggle expand/collapse for assigned section L3 nodes
  document.querySelectorAll('#rtree .r-tog[data-r-tog]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.rTog;
      if (S.rightExpanded.has(id)) S.rightExpanded.delete(id);
      else S.rightExpanded.add(id);
      renderRight();
    });
  });

  // Also allow clicking anywhere on an L4 structural child row to toggle it
  document.querySelectorAll('#rtree .sec-child-row[style*="cursor:pointer"]').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.grip')) return; // don't fire on grip drags
      const tog = el.querySelector('.r-tog[data-r-tog]');
      if (!tog) return;
      e.stopPropagation();
      const id = tog.dataset.rTog;
      if (S.rightExpanded.has(id)) S.rightExpanded.delete(id);
      else S.rightExpanded.add(id);
      renderRight();
    });
  });

  // Double-click to rename right panel labels (L2 sections and L3 assigned chips)
  function makeRenameHandler(getObj) {
    return function(e) {
      e.stopPropagation();
      const lbl = e.currentTarget.querySelector('.lbl');
      if (!lbl || lbl.querySelector('input')) return;
      const obj = getObj(e.currentTarget);
      if (!obj) return;
      const oldName = obj.label;
      const input = document.createElement('input');
      input.type = 'text';
      input.value = oldName;
      input.style.cssText = 'flex:1;font-size:inherit;font-family:inherit;border:1px solid #4a8;border-radius:2px;padding:0 3px;outline:none;min-width:0;background:transparent';
      lbl.replaceWith(input);
      input.focus(); input.select();
      let saved = false;
      function save() {
        if (saved) return; saved = true;
        const newName = input.value.trim() || oldName;
        if (newName !== oldName) {
          obj.label = newName;
          pushAction([{kind:'rename', id: obj.id || obj._renameKey, from:oldName, to:newName}]);
        }
        renderRight();
      }
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter')  { ev.preventDefault(); save(); }
        if (ev.key === 'Escape') { saved = true; renderRight(); }
      });
      input.addEventListener('blur', save);
    };
  }

  // L2 section chips
  document.querySelectorAll('#rtree .rsec-chip').forEach(el => {
    const secId = el.closest('[data-rsec]')?.dataset.rsec;
    if (!secId) return;
    const sec = rsecIndex[secId];
    if (!sec) return;
    sec._renameKey = secId;
    el.addEventListener('dblclick', makeRenameHandler(() => sec));
  });

  // L3 assigned chips
  document.querySelectorAll('#rtree .assigned-chip').forEach(el => {
    const header = el.closest('[data-assigned-id]');
    if (!header) return;
    const id = header.dataset.assignedId;
    const node = nodeIndex[id];
    if (!node) return;
    el.addEventListener('dblclick', makeRenameHandler(() => node));
  });
  // Unified section/subsection grip — sec-universal handles all levels with ghost + cross-context moves
  document.querySelectorAll('#rtree .grip[data-sec-grip]').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault();
      const id      = el.dataset.secGrip;
      const secType = el.dataset.secType;    // 'l2sec' | 'assigned' | 'subsec'
      const parent  = el.dataset.secParent || el.dataset.secSuite || '';
      const suiteId = el.dataset.secSuite  || '';
      const label   = el.dataset.secLabel  || '';
      const ctxId   = secType === 'l2sec' ? suiteId : parent;
      const ghost   = document.getElementById('drag-ghost');
      ghost.textContent = '▦ ' + label;
      ghost.style.left  = (e.clientX + 14) + 'px';
      ghost.style.top   = (e.clientY - 10) + 'px';
      ghost.style.display = 'block';
      prepareDrag(e, [], false, null, null, {type:'sec-universal', itemId:id, contextId:ctxId, secType, suiteId, label});
    });
  });

  // Suite (L1) expand/collapse toggle
  document.querySelectorAll('#rtree [data-suite-tog]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const suiteId = el.dataset.suiteTog;
      if (S.suiteCollapsed.has(suiteId)) S.suiteCollapsed.delete(suiteId);
      else S.suiteCollapsed.add(suiteId);
      render();
    });
  });

  // L2 section expand/collapse toggle
  document.querySelectorAll('#rtree [data-l2-tog]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const secId = el.dataset.l2Tog;
      if (S.l2Collapsed.has(secId)) S.l2Collapsed.delete(secId);
      else S.l2Collapsed.add(secId);
      render();
    });
  });

  // Remove subsection chip
  document.querySelectorAll('#rtree [data-remove-subsec]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const subId    = el.dataset.removeSubsec;
      const parentId = el.dataset.parentSec;
      const parent   = rsecIndex[parentId];
      if (!parent?.subsections) return;
      const idx = parent.subsections.findIndex(s => s.id === subId);
      if (idx === -1) return;
      const secObj = JSON.parse(JSON.stringify(parent.subsections[idx]));
      // Clean up all assignments inside the removed subsection
      Object.entries(S.assignments).forEach(([k,v]) => { if (v === subId) delete S.assignments[k]; });
      delete S.directArticles[subId];
      delete S.sectionOrder[subId];
      S.l2Collapsed.delete(subId);
      parent.subsections.splice(idx, 1);
      delete rsecIndex[subId];
      pushAction([{kind:'remove-subsec', parentId, subId, secObj, atIndex:idx}]);
      autoSave();
      render();
      flashStatus('Removed');
    });
  });

  // L2 section delete
  document.querySelectorAll('#rtree [data-remove-l2]').forEach(el => {
    el.addEventListener('click', e => {
      const suite  = RIGHT.find(s => s.sections.some(sec => sec.id === secId));
      if (!suite) return;
      const idx = suite.sections.findIndex(s => s.id === secId);
      if (idx === -1) return;
      const secObj = JSON.parse(JSON.stringify(suite.sections[idx]));
      // Clean up all state referencing this section
      Object.entries(S.assignments).forEach(([k,v]) => { if (v === secId) delete S.assignments[k]; });
      delete S.directArticles[secId];
      delete S.sectionOrder[secId];
      S.l2Collapsed.delete(secId);
      suite.sections.splice(idx, 1);
      delete rsecIndex[secId];
      pushAction([{kind:'remove-l2-sec', suiteId:suite.id, secId, secObj, atIndex:idx}]);
      autoSave();
      render();
    });
  });

  // Unified article grip — reorder within context OR move to different section/level
  document.querySelectorAll('#rtree .grip[data-art-grip]').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault();
      const artId   = el.dataset.artGrip;
      const ctx     = el.dataset.artCtx;
      const srcType = el.dataset.artSrcType;
      const level   = el.dataset.artLevel;
      const title   = el.dataset.artTitle || '';
      const ghost   = document.getElementById('drag-ghost');
      ghost.textContent = '📄 ' + title;
      ghost.style.left  = (e.clientX + 14) + 'px';
      ghost.style.top   = (e.clientY - 10) + 'px';
      ghost.style.display = 'block';
      prepareDrag(e, [], false, null, null, {type:'art-universal', itemId:artId, contextId:ctx, srcType, level});
    });
  });

  document.querySelectorAll('#rtree .grip[data-reorder-l4c]').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault();
      prepareDrag(e, [], false, null, null, {type:'l4c', itemId:el.dataset.reorderL4c, contextId:el.dataset.l4cCtx});
    });
  });

  // Promote subsection to L2 — suite picker
  function showSuitePicker(title, onSelect) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9000;display:flex;align-items:center;justify-content:center';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:8px;padding:20px;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.2);font-family:-apple-system,sans-serif';
    box.innerHTML = `<div style="font-size:13px;font-weight:600;margin-bottom:6px">Promote to L2</div><div style="font-size:11px;color:#888;margin-bottom:14px">${title}</div>`;
    RIGHT.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s.label;
      btn.style.cssText = 'display:block;width:100%;text-align:left;padding:7px 10px;margin-bottom:5px;border:1px solid #ddd;border-radius:4px;cursor:pointer;font-size:11px;background:#fafafa';
      btn.onmouseover = () => btn.style.background = '#f0f8f0';
      btn.onmouseout  = () => btn.style.background = '#fafafa';
      btn.addEventListener('click', () => { document.body.removeChild(overlay); onSelect(s.id, s); });
      box.appendChild(btn);
    });
    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel';
    cancel.style.cssText = 'display:block;width:100%;padding:6px;border:none;cursor:pointer;font-size:11px;color:#999;background:none;margin-top:4px';
    cancel.addEventListener('click', () => document.body.removeChild(overlay));
    box.appendChild(cancel);
    overlay.appendChild(box);
    overlay.addEventListener('click', ev => { if (ev.target === overlay) document.body.removeChild(overlay); });
    document.body.appendChild(overlay);
  }

  document.querySelectorAll('#rtree .promote-btn[data-promote]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const secId = el.dataset.promote;
      const sec   = findSecById(secId);
      if (!sec) return;
      showSuitePicker(`Move "<b>${sec.label}</b>" to which suite?`, (targetSuiteId, targetSuite) => {
        const extracted = extractSec(secId);
        if (extracted) {
          placeSec(extracted.sec, 'suite', targetSuiteId);
          pushAction([{kind:'sec-nest', secId, parentType:extracted.parentType, parentId:extracted.parentId, index:extracted.index, targetType:'suite', targetId:targetSuiteId}]);
          flashStatus(`"${sec.label}" promoted to L2 in ${targetSuite.label}`);
          render();
        }
      });
    });
  });

  // Promote assigned L3 chip to a new standalone L2 section
  document.querySelectorAll('#rtree .promote-btn[data-promote-assigned]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const nodeId = el.dataset.promoteAssigned;
      const node   = nodeIndex[nodeId];
      if (!node) return;
      showSuitePicker(`Make "<b>${node.label}</b>" its own L2 section in which suite?`, (targetSuiteId, targetSuite) => {
        const oldSecId = S.assignments[nodeId] || null;
        const newSec   = {id:`promoted-${nodeId}`, label:node.label, subsections:[], suiteColor:targetSuite.color};
        targetSuite.sections.push(newSec);
        rsecIndex[newSec.id] = newSec;
        S.assignments[nodeId] = newSec.id;
        pushAction([{kind:'promote-assigned', nodeId, oldSecId, newSecId:newSec.id, targetSuiteId}]);
        flashStatus(`"${node.label}" is now an L2 section in ${targetSuite.label}`);
        render();
      });
    });
  });
  document.querySelectorAll('#rtree .rsec-chip').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.stopPropagation();
      const secId = el.closest('[data-rsec]')?.dataset.rsec;
      if (!secId) return;
      const fromSuiteId = el.closest('.suite-block')?.dataset.suiteId;
      if (!fromSuiteId) return;
      prepareDrag(e, [], false, null, {secId, fromSuiteId});
    });
  });

  document.querySelectorAll('#rtree .assigned-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      if (e.target.classList.contains('remove-btn')) return;
      const id = el.dataset.assignedId;
      prepareDrag(e, [id], true);
    });
  });

  // Drag from right: section-type assigned headers
