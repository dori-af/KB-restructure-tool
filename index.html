  document.querySelectorAll('#rtree .assigned-sec-header').forEach(el => {
    el.addEventListener('mousedown', e => {
      if (e.target.classList.contains('remove-btn') || e.target.classList.contains('r-tog')) return;
      const id = el.dataset.assignedId;
      prepareDrag(e, [id], true);
    });
  });
}

// ─── DRAG ────────────────────────────────────────────────────────────────────
const DRAG_THRESHOLD = 5;
const drag = { active:false, pending:false, ids:[], fromRight:false, article:null, rsec:null, reorder:null, insertBefore:null, target:null, startX:0, startY:0, _hoverTarget:null, _hoverEl:null, _hoverTimer:null };

// Hover-to-expand: blink a closed section twice then open it during article drag
function startHoverExpand(el, targetId, expandFn) {
  if (drag._hoverTarget === targetId) return;
  clearHoverExpand();
  drag._hoverTarget = targetId;
  drag._hoverEl = el;
  let count = 0;
  const MS = 120;
  function step() {
    if (!drag._hoverEl || drag._hoverTarget !== targetId) return;
    if (count < 4) {
      el.style.background = count % 2 === 0 ? 'rgba(0,0,0,.13)' : '';
      count++;
      drag._hoverTimer = setTimeout(step, MS);
    } else {
      el.style.background = '';
      drag._hoverEl = null; drag._hoverTarget = null; drag._hoverTimer = null;
      expandFn();
      render();
    }
  }
  drag._hoverTimer = setTimeout(step, MS);
}
function clearHoverExpand() {
  if (drag._hoverTimer) { clearTimeout(drag._hoverTimer); drag._hoverTimer = null; }
  if (drag._hoverEl)    { drag._hoverEl.style.background = ''; drag._hoverEl = null; }
  drag._hoverTarget = null;
}

// Called on mousedown — waits for movement threshold before activating drag
function prepareDrag(e, ids, fromRight=false, article=null, rsec=null, reorder=null) {
  drag.pending  = true;
  drag.active   = false;
  drag.ids      = ids;
  drag.fromRight = fromRight;
  drag.article  = article;
  drag.rsec     = rsec;
  drag.reorder  = reorder;
  drag.insertBefore = null;
  drag.target   = null;
  drag.startX   = e.clientX;
  drag.startY   = e.clientY;
  document.addEventListener('mousemove', onPendingMove);
  document.addEventListener('mouseup',   onPendingUp);
  e.preventDefault();
}

function onPendingMove(e) {
  if (!drag.pending) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (Math.sqrt(dx*dx + dy*dy) < DRAG_THRESHOLD) return;
  // Threshold crossed — activate drag
  drag.pending = false;
  drag.active  = true;
  document.removeEventListener('mousemove', onPendingMove);
  document.removeEventListener('mouseup',   onPendingUp);
  if (drag.rsec) document.getElementById('rtree')?.classList.add('dragging-rsec');
  const ghost = document.getElementById('ghost');
  if (drag.reorder) {
    ghost.style.display = 'none'; // reorder uses insertion line, not ghost
  } else {
    ghost.textContent = drag.article
      ? drag.article.title
      : drag.rsec
        ? rsecIndex[drag.rsec.secId]?.label || drag.rsec.secId
        : drag.ids.length === 1
      ? (nodeIndex[drag.ids[0]]?.label || drag.ids[0])
      : `${drag.ids.length} subsections`;
    ghost.style.left = (e.clientX + 14) + 'px';
    ghost.style.top  = (e.clientY - 12) + 'px';
    ghost.style.display = 'block';
  }
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragEnd);
}

function onPendingUp() {
  // Released before threshold — pure click, keep selection as-is
  drag.pending = false;
  document.removeEventListener('mousemove', onPendingMove);
  document.removeEventListener('mouseup',   onPendingUp);
  // Hide art drag ghost in case it was shown on mousedown
  const artGhost = document.getElementById('drag-ghost');
  if (artGhost) artGhost.style.display = 'none';
  clearHoverExpand();
}

function onDragMove(e) {
  if (!drag.active) return;
  const ghost = document.getElementById('ghost');
  const line  = document.getElementById('insert-line');

  if (drag.reorder) {
    // Reorder mode: show insertion line between items
    const { type, itemId, contextId } = drag.reorder;
    let els = [];
    if (type === 'l2') {
      els = [...document.querySelectorAll(`.suite-block[data-suite-id="${contextId}"] .rsec-row[data-rsec]`)];
    } else if (type === 'l3u') {
      // All L3 items in this section — both assigned chips and subsection chips, sorted by DOM position
      const assignedEls = [...document.querySelectorAll('#rtree [data-assigned-id]')]
        .filter(el => S.assignments[el.dataset.assignedId] === contextId);
      const subsecEls   = [...document.querySelectorAll(`#rtree .grip[data-reorder-l3-ctx="${contextId}"][data-reorder-l3-key^="s:"]`)]
        .map(g => g.closest('.rsec-row[data-rsec]')).filter(Boolean);
      els = [...assignedEls, ...subsecEls].sort((a, b) =>
        a.getBoundingClientRect().top - b.getBoundingClientRect().top
      );
    } else if (type === 'direct-art') {
      els = [...document.querySelectorAll(`#rtree .grip[data-reorder-direct][data-direct-sec="${contextId}"]`)]
        .map(g => g.closest('.sec-child-row')).filter(Boolean);
    } else if (type === 'sec-universal') {
      // Move ghost
      const ghost = document.getElementById('drag-ghost');
      if (ghost) { ghost.style.left = (e.clientX+14)+'px'; ghost.style.top = (e.clientY-10)+'px'; }
      document.getElementById('insert-line').style.display = 'none';
      drag.reorder.secDropCtx = null;
      drag.reorder.secDropInsertBefore = null;
      drag.reorder.secDropMode = null;
      const gEl2 = document.getElementById('drag-ghost');
      if (gEl2) gEl2.style.pointerEvents = 'none';
      const under2 = document.elementFromPoint(e.clientX, e.clientY);
      if (gEl2) gEl2.style.pointerEvents = '';
      if (!under2?.closest('#rtree')) { clearHoverExpand(); return; }
      // Hover-to-expand collapsed L2 sections
      const hoverSec = under2.closest('.rsec-row.l2[data-rsec]');
      if (hoverSec && S.l2Collapsed.has(hoverSec.dataset.rsec)) {
        const sid = hoverSec.dataset.rsec;
        startHoverExpand(hoverSec, sid, () => S.l2Collapsed.delete(sid));
      } else { clearHoverExpand(); }
      // Collapsed suite hover-to-expand
      const hoverSuiteBlock = under2.closest('.suite-block');
      if (hoverSuiteBlock) {
        const suiteId2 = [...hoverSuiteBlock.classList].find(c => c !== 'suite-block');
        if (suiteId2 && S.suiteCollapsed.has(suiteId2)) {
          const suiteEl = hoverSuiteBlock.querySelector('.suite-label');
          if (suiteEl) startHoverExpand(suiteEl, suiteId2, () => S.suiteCollapsed.delete(suiteId2));
        }
      }
      // All droppable section items sorted by Y, excluding dragged item
      const allSecItems = [
        ...[...document.querySelectorAll('#rtree [data-assigned-id]')]
          .filter(el => el.dataset.assignedId !== String(itemId)),
        ...[...document.querySelectorAll('#rtree .rsec-row[data-rsec]')]
          .filter(el => el.dataset.rsec !== String(itemId))
      ].sort((a,b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
      if (allSecItems.length === 0) return;
      // Find gap
      let secTargetEl = null, secIsAbove = true;
      for (let i = 0; i < allSecItems.length; i++) {
        const r = allSecItems[i].getBoundingClientRect();
        if (e.clientY <= r.top + r.height/2) { secTargetEl = allSecItems[i]; secIsAbove = true; break; }
        if (i === allSecItems.length-1 || e.clientY < allSecItems[i+1].getBoundingClientRect().top) {
          secTargetEl = allSecItems[i]; secIsAbove = false; break;
        }
      }
      if (!secTargetEl) return;
      const secTargetId = secTargetEl.dataset.assignedId || secTargetEl.dataset.rsec;
      const secTargetIsL2 = secTargetEl.classList.contains('l2');
      const secTargetIsAssigned = !!secTargetEl.dataset.assignedId;
      // Compute context of target
      let secDropCtx2;
      if (secTargetIsAssigned) {
        secDropCtx2 = S.assignments[secTargetId] || contextId;
      } else if (secTargetIsL2) {
        const ts = RIGHT.find(s => s.sections.some(sec => sec.id === secTargetId));
        secDropCtx2 = ts?.id || contextId;
      } else {
        // Subsection — find parent section via rsecIndex
        let foundParent = contextId;
        for (const [sid, sobj] of Object.entries(rsecIndex||{})) {
          if (sobj.subsections?.some(sub => sub.id === secTargetId)) { foundParent = sid; break; }
        }
        secDropCtx2 = foundParent;
      }
      // Compute insertBefore
      let secInsertBefore;
      if (secIsAbove) {
        secInsertBefore = secTargetId;
      } else {
        const sameCat = allSecItems.filter(el => {
          if (secTargetIsAssigned) return !!el.dataset.assignedId;
          if (secTargetIsL2) return el.classList.contains('l2');
          return !el.dataset.assignedId && !el.classList.contains('l2');
        });
        const idx = sameCat.indexOf(secTargetEl);
        const nxt = sameCat[idx+1];
        secInsertBefore = nxt ? (nxt.dataset.assignedId || nxt.dataset.rsec) : null;
      }
      drag.reorder.secDropCtx = secDropCtx2;
      drag.reorder.secDropInsertBefore = secInsertBefore;
      drag.reorder.secDropMode = secDropCtx2 === contextId ? 'reorder' : 'move';
      drag.reorder.secDropTargetIsL2 = secTargetIsL2;
      drag.reorder.secDropTargetIsAssigned = secTargetIsAssigned;
      const rrS = secTargetEl.getBoundingClientRect();
      const lineYS = secIsAbove ? rrS.top-1 : rrS.bottom-1;
      const lineS = document.getElementById('insert-line');
      lineS.style.display = 'block'; lineS.style.top = lineYS+'px';
      lineS.style.left = rrS.left+'px'; lineS.style.width = rrS.width+'px';
      return;
    } else if (type === 'art-move') {
      document.querySelectorAll('#rtree .rsec-row.drop-active').forEach(el => el.classList.remove('drop-active'));
      const underCursor = document.elementFromPoint(e.clientX, e.clientY);
      const targetRow = underCursor?.closest('.rsec-row[data-rsec]');
      if (targetRow && targetRow.dataset.rsec !== contextId) {
        targetRow.classList.add('drop-active');
        drag.reorder.artMoveTarget = targetRow.dataset.rsec;
      } else { drag.reorder.artMoveTarget = null; }
      document.getElementById('insert-line').style.display = 'none';
      return;
    } else if (type === 'art-universal') {
      // Move ghost
      const ghost = document.getElementById('drag-ghost');
      if (ghost) { ghost.style.left = (e.clientX + 14) + 'px'; ghost.style.top = (e.clientY - 10) + 'px'; }
      document.getElementById('insert-line').style.display = 'none';
      drag.reorder.dropCtx = null;
      drag.reorder.dropCtxType = null;
      drag.reorder.dropInsertBefore = null;
      drag.reorder.dropSrcType = null;
      drag.reorder.mode = null;

      // Check cursor is over the right panel
      const gEl = document.getElementById('drag-ghost');
      if (gEl) gEl.style.pointerEvents = 'none';
      const under = document.elementFromPoint(e.clientX, e.clientY);
      if (gEl) gEl.style.pointerEvents = '';
      if (!under?.closest('#rtree')) { clearHoverExpand(); return; }

      // Hover-to-expand: if cursor is directly over a CLOSED chip or section, blink and open it
      const closedChip = under.closest('[data-assigned-id]');
      const closedSec  = !closedChip && under.closest('.rsec-row[data-rsec]');
      const closedEl   = closedChip || closedSec;
      const closedId   = closedEl?.dataset.assignedId || closedEl?.dataset.rsec;
      const isClosed   = closedEl && closedId && closedId !== contextId && (
        closedChip ? !S.rightExpanded.has(closedId) : S.l2Collapsed.has(closedId)
      );
      if (isClosed) {
        const expandFn = closedChip
          ? () => S.rightExpanded.add(closedId)
          : () => S.l2Collapsed.delete(closedId);
        startHoverExpand(closedEl, closedId, expandFn);
        const rr = closedEl.getBoundingClientRect();
        const line = document.getElementById('insert-line');
        line.style.display = 'block'; line.style.top = (rr.bottom-1)+'px';
        line.style.left = rr.left+'px'; line.style.width = rr.width+'px';
        drag.reorder.dropCtx = closedId;
        drag.reorder.dropCtxType = closedChip ? 'node' : 'sec';
        drag.reorder.dropInsertBefore = null;
        drag.reorder.dropSrcType = 'direct';
        drag.reorder.mode = 'move';
        return;
      } else {
        clearHoverExpand();
      }

      // All article rows in the right panel except the dragged one, sorted top-to-bottom
      const allRows = [...document.querySelectorAll('#rtree .sec-child-row[data-art-id]')]
        .filter(r => r.dataset.artId !== String(itemId))
        .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);

      if (allRows.length === 0) {
        // No article rows visible — try fallback to chip/section header
      } else {

      // Find which gap the cursor sits in
      let targetRow = null, isAbove = true;
      for (let i = 0; i < allRows.length; i++) {
        const r = allRows[i].getBoundingClientRect();
        if (e.clientY <= r.top + r.height / 2) { targetRow = allRows[i]; isAbove = true; break; }
        if (i === allRows.length - 1 || e.clientY < allRows[i+1].getBoundingClientRect().top) {
          targetRow = allRows[i]; isAbove = false; break;
        }
      }

      if (targetRow) {
        const dropCtx     = targetRow.dataset.artSrcCtx;
        const dropLevel   = targetRow.dataset.artLevel || 'l3';
        const dropCtxType = dropLevel === 'l3' ? 'sec' : dropLevel === 'l4' ? 'node' : 'child';
        const dropSType   = targetRow.dataset.artSrcType;
        let insertBefore;
        if (isAbove) {
          insertBefore = targetRow.dataset.artId;
        } else {
          const ctxRows = allRows.filter(r => r.dataset.artSrcCtx === dropCtx);
          const idx = ctxRows.indexOf(targetRow);
          insertBefore = ctxRows[idx + 1]?.dataset.artId || null;
        }
        drag.reorder.dropCtx = dropCtx;
        drag.reorder.dropCtxType = dropCtxType;
        drag.reorder.dropInsertBefore = insertBefore;
        drag.reorder.dropSrcType = dropSType;
        drag.reorder.mode = dropCtx === contextId ? 'reorder' : 'move';
        const rr = targetRow.getBoundingClientRect();
        const lineY = isAbove ? rr.top - 1 : rr.bottom - 1;
        const line = document.getElementById('insert-line');
        line.style.display = 'block';
        line.style.top    = lineY + 'px';
        line.style.left   = rr.left + 'px';
        line.style.width  = rr.width + 'px';
        return;
      }
      } // end else (allRows.length > 0)

      // Fallback: cursor over a chip header or section header (collapsed, no article rows visible)
      const chipHeader = under.closest('[data-assigned-id]') || under.closest('.rsec-row[data-rsec]');
      if (chipHeader) {
        const targetId  = chipHeader.dataset.assignedId || chipHeader.dataset.rsec;
        const ctxType   = chipHeader.dataset.assignedId ? 'node' : 'sec';
        if (targetId && targetId !== contextId) {
          drag.reorder.dropCtx       = targetId;
          drag.reorder.dropCtxType   = ctxType;
          drag.reorder.dropInsertBefore = null;
          drag.reorder.dropSrcType   = 'direct';
          drag.reorder.mode          = 'move';
          const rr = chipHeader.getBoundingClientRect();
          const line = document.getElementById('insert-line');
          line.style.display = 'block';
          line.style.top     = (rr.bottom - 1) + 'px';
          line.style.left    = rr.left + 'px';
          line.style.width   = rr.width + 'px';
        }
      }
      return;
    } else if (type === 'l4c') {
      els = [...document.querySelectorAll(`#rtree .grip[data-reorder-l4c][data-l4c-ctx="${contextId}"]`)]
        .map(g => g.closest('.sec-child-row')).filter(Boolean);
    } else if (type === 'l4a') {
      els = [...document.querySelectorAll(`#rtree .grip[data-reorder-l4a][data-l4a-ctx="${contextId}"]`)]
        .map(g => g.closest('.sec-child-row')).filter(Boolean);
    } else if (type === 'l5a') {
      els = [...document.querySelectorAll(`#rtree .grip[data-reorder-l5a][data-l5a-ctx="${contextId}"]`)]
        .map(g => g.closest('.sec-child-row')).filter(Boolean);
    } else if (type === 'article') {
      els = [...document.querySelectorAll(`#ltree .art-row[data-zid="${contextId}"]`)];
    }
    // Find insertion gap
    let insertBefore = null;
    let lineY = null;
    let lineLeft = 0, lineWidth = 200;
    for (let i = 0; i < els.length; i++) {
      const r = els[i].getBoundingClientRect();
      lineLeft = r.left; lineWidth = r.width;
      const mid = r.top + r.height / 2;
      if (e.clientY < mid) {
        // For l3u, encode key as 's:' or 'n:' prefix
        if (type === 'l3u') {
          const secId = els[i].dataset.rsec;
          const nodeId = els[i].dataset.assignedId;
          insertBefore = secId ? 's:' + secId : nodeId ? 'n:' + nodeId : null;
        } else if (type === 'direct-art') {
          const grip = els[i].querySelector('.grip[data-reorder-direct]');
          insertBefore = grip ? grip.dataset.reorderDirect : null;
        } else if (type === 'l4c' || type === 'l4a' || type === 'l5a') {
          insertBefore = els[i].dataset.gripId || null;
        } else {
          insertBefore = els[i].dataset.rsec || els[i].dataset.assignedId || els[i].dataset.artId;
        }
        lineY = r.top - 1;
        break;
      }
      if (i === els.length - 1) lineY = r.bottom + 1;
    }
    drag.insertBefore = insertBefore;
    if (lineY !== null) {
      line.style.cssText = `display:block;left:${lineLeft}px;top:${lineY}px;width:${lineWidth}px`;
    } else {
      line.style.display = 'none';
    }
    return;
  }

  ghost.style.left = (e.clientX + 14) + 'px';
  ghost.style.top  = (e.clientY - 12) + 'px';
  line.style.display = 'none';

  ghost.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  ghost.style.display = 'block';

  if (drag.rsec) {
    const l2DropEl = el?.closest('.suite-l2-drop[data-suite-id]');
    const rsecEl   = l2DropEl ? null : el?.closest('.rsec-row[data-rsec]');
    const suiteEl  = (rsecEl || l2DropEl) ? null : el?.closest('.suite-block[data-suite-id]');
    const newTarget = l2DropEl ? 'suite:' + l2DropEl.dataset.suiteId
                    : rsecEl   ? rsecEl.dataset.rsec
                    : suiteEl  ? 'suite:' + suiteEl.dataset.suiteId
                    : null;
    if (newTarget !== drag.target) {
      if (drag.target) {
        const prevId = drag.target.startsWith('suite:') ? drag.target.slice(6) : drag.target;
        if (drag.target.startsWith('suite:')) {
          document.querySelector(`.suite-block[data-suite-id="${prevId}"]`)?.classList.remove('suite-drop-active');
          document.querySelector(`.suite-l2-drop[data-suite-id="${prevId}"]`)?.classList.remove('drop-active');
        } else {
          document.getElementById('rsec-' + prevId)?.classList.remove('drop-active');
        }
      }
      drag.target = newTarget;
      if (drag.target && drag.target !== drag.rsec.secId) {
        if (drag.target.startsWith('suite:')) {
          const tid = drag.target.slice(6);
          document.querySelector(`.suite-l2-drop[data-suite-id="${tid}"]`)?.classList.add('drop-active');
        } else {
          document.getElementById('rsec-' + drag.target)?.classList.add('drop-active');
        }
      }
    }
    return;
  }

  const rsecRow = el?.closest('.rsec-row');
  const newTarget = rsecRow ? rsecRow.dataset.rsec : null;

  if (newTarget !== drag.target) {
    if (drag.target) document.getElementById('rsec-' + drag.target)?.classList.remove('drop-active');
    drag.target = newTarget;
    if (drag.target) document.getElementById('rsec-' + drag.target)?.classList.add('drop-active');
  }

  drag.ids.forEach(id => {
    document.querySelector(`[data-id="${id}"], [data-assigned-id="${id}"]`)?.classList.add('dragging-source');
  });
}

function onDragEnd(e) {
  if (!drag.active) return;
  drag.active = false;
  document.getElementById('ghost').style.display = 'none';
  document.getElementById('drag-ghost').style.display = 'none';
  document.getElementById('insert-line').style.display = 'none';
  clearHoverExpand();
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup',   onDragEnd);
  document.getElementById('rtree')?.classList.remove('dragging-rsec');
  document.querySelectorAll('.suite-block.suite-drop-active').forEach(el => el.classList.remove('suite-drop-active'));
  document.querySelectorAll('.suite-l2-drop.drop-active').forEach(el => el.classList.remove('drop-active'));
  if (drag.target) document.getElementById('rsec-' + drag.target)?.classList.remove('drop-active');

  // ── Reorder drop ──────────────────────────────────────────────────────────
  if (drag.reorder) {
    const { type, itemId, contextId } = drag.reorder;
    const insertBefore = drag.insertBefore; // null = end
    const before = {};
    const after  = {};

    if (type === 'l2') {
      const suite = suiteIndex[contextId];
      if (suite) {
        const ids = suite.sections.map(s => s.id);
        if (ids.indexOf(itemId) !== -1) {
          before.l2 = [...ids];
          const newIds = applyReorder(ids, itemId, insertBefore);
          suite.sections.sort((a, b) => newIds.indexOf(a.id) - newIds.indexOf(b.id));
          after.l2 = [...newIds];
        }
      }
    } else if (type === 'l3u') {
      // Unified L3 reorder — covers both assigned chips and subsection chips
      const currentItems = getUnifiedL3Items(contextId);
      const currentKeys  = currentItems.map(i => i.key);
      before.sectionOrder = [...currentKeys];
      const newKeys = applyReorder(currentKeys, itemId, insertBefore);
      S.sectionOrder[contextId] = newKeys;
      after.sectionOrder = [...newKeys];
      // Also reorder parentSec.subsections array to match new order
      const sec = rsecIndex[contextId];
      if (sec?.subsections) {
        const subOrder = newKeys.filter(k => k.startsWith('s:')).map(k => k.slice(2));
        sec.subsections.sort((a,b) => subOrder.indexOf(a.id) - subOrder.indexOf(b.id));
      }
    } else if (type === 'sec-universal') {
      document.getElementById('drag-ghost').style.display = 'none';
      document.getElementById('insert-line').style.display = 'none';
      clearHoverExpand();
      const secDropCtx        = drag.reorder?.secDropCtx;
      const secInsertBefore   = drag.reorder?.secDropInsertBefore;
      const secMode           = drag.reorder?.secDropMode;
      const _secType          = drag.reorder?.secType;    // 'l2sec'|'assigned'|'subsec'
      const _suiteId          = drag.reorder?.suiteId;
      drag.reorder = null;
      if (!secDropCtx || !secMode) { render(); return; }

      function getUnifiedL3Keys(secId) {
        const sec = rsecIndex[secId]; if (!sec) return [];
        const assignedKeys = Object.entries(S.assignments)
          .filter(([,v]) => v === secId).map(([k]) => 'n:'+k);
        const subKeys = (sec.subsections||[]).map(s => 's:'+s.id);
        const order = S.sectionOrder[secId];
        if (!order) return [...assignedKeys, ...subKeys];
        const all = [...assignedKeys, ...subKeys];
        const sorted = order.filter(k => all.includes(k));
        all.forEach(k => { if (!sorted.includes(k)) sorted.push(k); });
        return sorted;
      }

      if (_secType === 'assigned') {
        // L3 assigned chip move
        const oldSecId = S.assignments[itemId];
        const isSame = secDropCtx === oldSecId;
        if (isSame) {
          // Reorder within same section
          const keys = getUnifiedL3Keys(oldSecId);
          const ib = secInsertBefore ? 'n:'+secInsertBefore : null;
          S.sectionOrder[oldSecId] = applyReorder(keys, 'n:'+itemId, ib);
        } else {
          // Move to different section
          const oldKeys = getUnifiedL3Keys(oldSecId).filter(k => k !== 'n:'+itemId);
          S.sectionOrder[oldSecId] = oldKeys;
          S.assignments[itemId] = secDropCtx;
          const newKeys = getUnifiedL3Keys(secDropCtx);
          const ib = secInsertBefore ? 'n:'+secInsertBefore : null;
          if (!newKeys.includes('n:'+itemId)) newKeys.push('n:'+itemId);
          S.sectionOrder[secDropCtx] = applyReorder(newKeys, 'n:'+itemId, ib);
          S.l2Collapsed.delete(secDropCtx);
        }
        pushAction([{kind:'flatten-snapshot', before:{assignments:{...S.assignments}, sectionOrder:{...S.sectionOrder}}, after:{assignments:{...S.assignments}, sectionOrder:{...S.sectionOrder}}, _logData:{text:(() => {
          const n = nodeIndex[itemId]; const lbl = n?.label || itemId;
          const isSame2 = secDropCtx === S.assignments[itemId]; // re-read after mutation: will be secDropCtx
          if (isSame2) { const keys = S.sectionOrder[secDropCtx]||[]; const pos = keys.indexOf('n:'+itemId)+1; return `Reordered in ${secDropCtx}\n  "${lbl}" (Section) to ${pos}`; }
          function rp2(id){for(const s of RIGHT){if(s.sections.some(x=>x.id===id))return[s.label,rsecIndex[id]?.label||id];for(const sec of s.sections){if(sec.subsections?.some(x=>x.id===id))return[s.label,sec.label,rsecIndex[id]?.label||id];}}return null;}
          const fromP = rp2(S.assignments[itemId])?.slice(0,-1)||[secDropCtx]; // secDropCtx is already new
          const toP = rp2(secDropCtx)||[secDropCtx]; const keys2=S.sectionOrder[secDropCtx]||[]; const pos2=keys2.indexOf('n:'+itemId)+1;
          return `Moved "${lbl}" (Section)\n  To: position ${pos2} in ${toP.join(' / ')}`;
        })()}}]);

      } else if (_secType === 'subsec') {
        // L3 subsection chip move
        const oldSec = Object.values(rsecIndex).find(s => s.subsections?.some(sub => sub.id === itemId));
        if (!oldSec) { render(); return; }
        const isSame = secDropCtx === oldSec.id;
        if (isSame) {
          const keys = getUnifiedL3Keys(oldSec.id);
          const ib = secInsertBefore ? 's:'+secInsertBefore : null;
          S.sectionOrder[oldSec.id] = applyReorder(keys, 's:'+itemId, ib);
        } else {
          const subIdx = oldSec.subsections.findIndex(s => s.id === itemId);
          const [subObj] = oldSec.subsections.splice(subIdx, 1);
          S.sectionOrder[oldSec.id] = getUnifiedL3Keys(oldSec.id).filter(k => k !== 's:'+itemId);
          const newSec = rsecIndex[secDropCtx];
          if (newSec) {
            newSec.subsections = newSec.subsections || [];
            newSec.subsections.push(subObj);
            rsecIndex[itemId] = subObj;
            const newKeys = getUnifiedL3Keys(secDropCtx);
            if (!newKeys.includes('s:'+itemId)) newKeys.push('s:'+itemId);
            S.sectionOrder[secDropCtx] = applyReorder(newKeys, 's:'+itemId, secInsertBefore ? 's:'+secInsertBefore : null);
            S.l2Collapsed.delete(secDropCtx);
          }
        }
        pushAction([{kind:'flatten-snapshot', before:{sectionOrder:{...S.sectionOrder}}, after:{sectionOrder:{...S.sectionOrder}}, _logData:{text:`Moved "${rsecIndex[itemId]?.label||itemId}" (Section)`}}]);

      } else if (_secType === 'l2sec') {
        // L2 section move within or between suites
        const srcSuite = RIGHT.find(s => s.sections.some(sec => sec.id === itemId));
        const tgtSuite = RIGHT.find(s => s.id === secDropCtx);
        if (!srcSuite || !tgtSuite) { render(); return; }
        const secIdx = srcSuite.sections.findIndex(s => s.id === itemId);
        const [secObj] = srcSuite.sections.splice(secIdx, 1);
        if (secInsertBefore) {
          const ibIdx = tgtSuite.sections.findIndex(s => s.id === secInsertBefore);
          if (ibIdx !== -1) tgtSuite.sections.splice(ibIdx, 0, secObj);
          else tgtSuite.sections.push(secObj);
        } else {
          tgtSuite.sections.push(secObj);
        }
        pushAction([{kind:'flatten-snapshot', before:{}, after:{}, _logData:{text:`Moved "${rsecIndex[itemId]?.label||itemId}" (Section)\n  To suite: ${tgtSuite?.label||secDropCtx}`}}]);
      }

      autoSave(); render(); return;
    } else if (type === 'art-universal') {
      document.getElementById('drag-ghost').style.display = 'none';
      document.getElementById('insert-line').style.display = 'none';
      document.querySelectorAll('#rtree .drop-active').forEach(el => el.classList.remove('drop-active'));
      const dropCtx    = drag.reorder?.dropCtx;
      const dropCType  = drag.reorder?.dropCtxType;
      const dropBefore = drag.reorder?.dropInsertBefore || null;
      const dropSType  = drag.reorder?.dropSrcType;
      const isSameCtx  = dropCtx === contextId;
      const artId      = String(itemId);
      const _srcType   = drag.reorder?.srcType || 'cache';
      drag.reorder = null;
      if (!dropCtx) { render(); return; }
      // Find artObj
      let artObj = _srcType === 'direct'
        ? (S.directArticles[contextId]||[]).find(a => String(a.id) === artId) : null;
      if (!artObj) for (const arts of Object.values(S.articleCache)) {
        const f = (arts||[]).find(a => String(a.id) === artId); if (f) { artObj = f; break; }
      }
      if (!artObj) { render(); return; }
      if (isSameCtx) {
        // Unified reorder — always use r4ArtOrder so cache and direct articles interleave freely
        const allArts = unifiedChipArts(contextId);
        const currentIds = allArts.map(a => String(a.id));
        const withArt = currentIds.includes(artId) ? currentIds : [...currentIds, artId];
        before.r4ArtOrder = [...(S.r4ArtOrder[contextId] || currentIds)];
        S.r4ArtOrder[contextId] = applyReorder(withArt, artId, dropBefore ? String(dropBefore) : null);
        after.r4ArtOrder = [...S.r4ArtOrder[contextId]];
        pushAction([{kind:'reorder', type:'l4a', itemId:artId, contextId, before, after}]);
      } else {
        // Cross-context move — remove from source, insert at exact position in target
        if (_srcType === 'direct') {
          S.directArticles[contextId] = (S.directArticles[contextId]||[]).filter(a => String(a.id) !== artId);
          if (!S.directArticles[contextId]?.length) delete S.directArticles[contextId];
          if (S.r4ArtOrder[contextId]) S.r4ArtOrder[contextId] = S.r4ArtOrder[contextId].filter(id => String(id) !== artId);
        } else {
          S.suppressedArts[artId] = true;
          if (S.r4ArtOrder[contextId]) S.r4ArtOrder[contextId] = S.r4ArtOrder[contextId].filter(id => String(id) !== artId);
        }
        // Add to target directArticles
        S.directArticles[dropCtx] = [...(S.directArticles[dropCtx]||[]), artObj];
        // Place at correct position in target's unified r4ArtOrder
        const tArts = unifiedChipArts(dropCtx);
        const tIds  = tArts.map(a => String(a.id));
        const tWithNew = tIds.includes(artId) ? tIds : [...tIds, artId];
        S.r4ArtOrder[dropCtx] = applyReorder(tWithNew, artId, dropBefore ? String(dropBefore) : null);
        if (dropCType === 'node' || dropCType === 'child') S.rightExpanded.add(dropCtx);
        pushAction([{kind:'art-move', artId, artObj, srcType:_srcType, srcCtx:contextId, targetSecId:dropCtx, targetType:dropCType}]);
      }
      autoSave(); render(); return;
    } else if (type === 'direct-art') {
      const arts = S.directArticles[contextId] || [];
      const ids  = arts.map(a => String(a.id));
      before.directArts = [...arts];
      const newIds = applyReorder(ids, String(itemId), insertBefore ? String(insertBefore) : null);
      S.directArticles[contextId] = newIds.map(id => arts.find(a => String(a.id) === id)).filter(Boolean);
      after.directArts = [...S.directArticles[contextId]];
    } else if (type === 'l4c') {
      const node = nodeIndex[contextId];
      const children = node?.children || [];
      const currentIds = (S.l4ChildOrder[contextId] || children.map(c => c.id));
      before.l4ChildOrder = [...currentIds];
      S.l4ChildOrder[contextId] = applyReorder(currentIds, itemId, insertBefore);
      after.l4ChildOrder = [...S.l4ChildOrder[contextId]];
    } else if (type === 'l4a' || type === 'l5a') {
      const node = nodeIndex[contextId];
      const rawArts = node?.zid ? S.articleCache[node.zid] : null;
      const arts = rawArts || [];
      const currentIds = (S.r4ArtOrder[contextId] || arts.map(a => a.id)).map(String);
      before.r4ArtOrder = [...currentIds];
      S.r4ArtOrder[contextId] = applyReorder(currentIds, String(itemId), insertBefore ? String(insertBefore) : null);
      after.r4ArtOrder = [...S.r4ArtOrder[contextId]];
    } else if (type === 'article') {
      const arts = sortedArticles(contextId);
      const ids = arts ? arts.map(a => a.id) : [];
      before.articleOrder = S.articleOrder[contextId] ? [...S.articleOrder[contextId]] : null;
      S.articleOrder[contextId] = applyReorder(ids, itemId, insertBefore);
      after.articleOrder = [...S.articleOrder[contextId]];
    }

    pushAction([{kind:'reorder', type, itemId, contextId, before, after}]);
    drag.reorder = null; drag.insertBefore = null;
    render();
    return;
  }

  const overLeft = e.clientX < document.getElementById('rcol').getBoundingClientRect().left;
  const changes = [];

  if (drag.rsec && drag.target && drag.target !== drag.rsec.secId) {
    const { secId } = drag.rsec;
    const isSuiteTarget = drag.target.startsWith('suite:');
    const targetId   = isSuiteTarget ? drag.target.slice(6) : drag.target;
    const targetType = isSuiteTarget ? 'suite' : 'section';
    const extracted  = extractSec(secId);
    if (extracted) {
      const { sec, parentType, parentId, index } = extracted;
      placeSec(sec, targetType, targetId);
      const targetLabel = isSuiteTarget
        ? suiteIndex[targetId]?.label
        : findSecById(targetId)?.label || targetId;
      pushAction([{kind:'sec-nest', secId, parentType, parentId, index, targetType, targetId}]);
      flashStatus(`"${sec.label}" → ${isSuiteTarget ? targetLabel + ' suite' : '"' + targetLabel + '"'}`);
    }
    drag.rsec = null; drag.target = null;
    render();
    return;
  }

  if (drag.article && drag.target) {
    // Article link drop — add to directArticles for the target section
    const secId = drag.target;
    const art   = drag.article;
    const before = [...(S.directArticles[secId] || [])];
    if (!before.find(a => a.id === art.id)) {
      S.directArticles[secId] = [...before, art];
      const after = [...S.directArticles[secId]];
      pushAction([{kind:'art-snap', secId, before, after}]);
      flashStatus(`Article added to "${rsecIndex[secId]?.label || secId}"`);
    }
    drag.article = null; drag.ids = []; drag.target = null;
    render();
    return;
  }

  if (drag.target) {
    drag.ids.forEach(id => {
      const from = S.assignments[id] || null;
      if (from !== drag.target) {
        changes.push({ id, from, to: drag.target });
        S.assignments[id] = drag.target;
      }
    });
    if (changes.length) { pushAction(changes); flashStatus(`Assigned to "${rsecIndex[drag.target]?.label || drag.target}"`); }
  } else if (overLeft && drag.fromRight) {
    drag.ids.forEach(id => {
      const from = S.assignments[id];
      if (from) { changes.push({ id, from, to: null }); delete S.assignments[id]; }
    });
    if (changes.length) { pushAction(changes); flashStatus('Unassigned'); }
  }

  // Only clear selection if a drop actually happened
  if (changes.length) { S.selected.clear(); updateSelBadge(); }
  drag.ids = []; drag.target = null;
  render();
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  if (e.key === 'Escape') { S.selected.clear(); updateSelBadge(); renderLeft(); }
});

// ─── ZOOM ────────────────────────────────────────────────────────────────────
const ZOOM_STEPS = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.4, 1.6, 1.8, 2];
let zoom = 1.2;

function applyZoom() {
  ['ltree-inner','rtree-inner'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.transform = `scale(${zoom})`;
    el.style.width = (100 / zoom) + '%';
  });
  document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
}
function zoomIn()    { const i = ZOOM_STEPS.indexOf(zoom); if (i < ZOOM_STEPS.length-1) { zoom = ZOOM_STEPS[i+1]; applyZoom(); } }
function zoomOut()   { const i = ZOOM_STEPS.indexOf(zoom); if (i > 0) { zoom = ZOOM_STEPS[i-1]; applyZoom(); } }
function zoomReset() { zoom = 1.2; applyZoom(); }

// ─── MODAL UTILITIES (replaces native alert/confirm, works in all contexts) ──
function modalOverlay(content) {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:10px;padding:24px 28px;max-width:520px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25);font-family:inherit;font-size:13px;line-height:1.6;';
  box.appendChild(content);
  ov.appendChild(box);
  const close = () => document.body.removeChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov);
  return { ov, close };
}

function showAlert(msg) {
  const wrap = document.createElement('div');
  const pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;font-family:inherit;margin:0 0 18px;';
  pre.textContent = msg;
  const btn = document.createElement('button');
  btn.textContent = 'OK';
  btn.style.cssText = 'float:right;padding:6px 18px;';
  btn.onclick = () => close();
  wrap.append(pre, btn);
  const { close } = modalOverlay(wrap);
  btn.focus();
}

function showConfirm(msg, onYes) {
  const wrap = document.createElement('div');
  const pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;font-family:inherit;margin:0 0 18px;';
  pre.textContent = msg;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;';
  const no = document.createElement('button');
  no.textContent = 'Cancel'; no.style.padding = '6px 16px';
  const yes = document.createElement('button');
  yes.textContent = 'Proceed'; yes.style.cssText = 'padding:6px 18px;font-weight:600;';
  no.onclick  = () => close();
  yes.onclick = () => { close(); onYes(); };
  row.append(no, yes);
  wrap.append(pre, row);
  const { close } = modalOverlay(wrap);
  yes.focus();
}

// ─── FLATTEN ─────────────────────────────────────────────────────────────────
// Removes redundant single-child intermediate nodes from the right-panel
// assignments. Only S.assignments changes — the left panel is untouched.
function flattenAssignments() {
  const beforeAssignments = {...S.assignments};
  const beforeDirectArts  = {...S.directArticles};

  const newAssign = {...S.assignments};
  const newDirect = {...S.directArticles};

  // ── Phase A: dissolve single-assignment right sections ────────────────────
  RIGHT.forEach(suite => {
    suite.sections.forEach(sec => {
      const single = Object.entries(newAssign).filter(([,v]) => v === sec.id);
      if (single.length !== 1) return;
      const [id] = single[0];
      const node = nodeIndex[id];
      if (!node) return;
      if (node.children && node.children.length > 0) {
        // Structural: promote children as new assignments
        delete newAssign[id];
        node.children.forEach(child => { newAssign[child.id] = sec.id; });
      } else {
        // Leaf: promote articles directly to section, remove wrapper
        const arts = node.zid ? S.articleCache[node.zid] : null;
        if (arts && arts.length > 0) {
          delete newAssign[id];
          newDirect[sec.id] = arts;
        }
      }
    });
  });

  // ── Phase B: walk single-child chains ─────────────────────────────────────
  Object.keys(newAssign).forEach(id => {
    const targetSec = newAssign[id];
    if (!targetSec) return;
    const node = nodeIndex[id];
    if (!node || !node.children || !node.children.length) return;
    let current = node;
    while (current.children && current.children.length === 1) current = current.children[0];
    if (current.id !== id) {
      delete newAssign[id];
      newAssign[current.id] = targetSec;
    }
  });

  // ── Nothing changed? ───────────────────────────────────────────────────────
  const assignChanged = JSON.stringify(beforeAssignments) !== JSON.stringify(newAssign);
  const directChanged = JSON.stringify(beforeDirectArts)  !== JSON.stringify(newDirect);
  if (!assignChanged && !directChanged) {
    showAlert(
      Object.keys(S.assignments).length > 0
        ? 'Nothing to flatten.\n\nNo single-child intermediates found in current assignments.'
        : 'Nothing to flatten.\n\nNo sections have been assigned yet.'
    );
    return;
  }

  // ── Build preview ─────────────────────────────────────────────────────────
  const bySection = {};
  const allIds = new Set([...Object.keys(beforeAssignments), ...Object.keys(newAssign)]);
  allIds.forEach(id => {
    const f = beforeAssignments[id] ?? null;
    const t = newAssign[id]        ?? null;
    if (f === t) return;
    const sec = t || f;
    if (!bySection[sec]) bySection[sec] = {removed:[], added:[], arts:null};
    if (f && !t) bySection[sec].removed.push(nodeIndex[id]?.label || id);
    if (!f && t) bySection[sec].added.push(nodeIndex[id]?.label || id);
  });
  Object.keys(newDirect).forEach(secId => {
    if (!beforeDirectArts[secId]) {
      if (!bySection[secId]) bySection[secId] = {removed:[], added:[], arts:null};
      bySection[secId].arts = newDirect[secId].length;
    }
  });

  const lines = Object.entries(bySection).map(([sec, {removed, added, arts}]) => {
    const lbl = rsecIndex[sec]?.label || sec;
    const parts = [];
    if (removed.length) parts.push(`wrapper removed: ${removed.join(', ')}`);
    if (added.length)   parts.push(`promoted: ${added.join(', ')}`);
    if (arts)           parts.push(`${arts} articles promoted directly`);
    return `  • "${lbl}": ${parts.join(' — ')}`;
  }).join('\n');

  const total = Object.keys(bySection).length;
  showConfirm(
    `${total} section${total>1?'s':''} will be flattened:\n\n${lines}\n\nProceed?`,
    () => {
      S.assignments    = newAssign;
      S.directArticles = newDirect;
      S.undoStack.push([{
        kind: 'flatten-snapshot',
        beforeAssignments, beforeDirectArts,
        afterAssignments: {...newAssign}, afterDirectArts: {...newDirect}
      }]);
      S.redoStack = [];
      updateUndoButtons();
      autoSave();
      render();
      flashStatus(`✓ Flattened ${total} section${total>1?'s':''}`);
    }
  );
}

// ─── SAVE / LOAD PROGRESS ────────────────────────────────────────────────────
const LS_KEY           = 'kb-subsection-mapping-v1';
const LS_LAST_SAVE_KEY = 'kb-subsection-mapping-last-save';
const LS_HISTORY_KEY   = 'kb-history-log';

function buildProgressPayload() {
  return {
    version: 2,
    savedAt: new Date().toISOString(),
    // Session state — needed to reload in the tool
    assignments:    { ...S.assignments },
    directArticles: { ...S.directArticles },
    sectionOrder:   { ...S.sectionOrder },
    articleOrder:   { ...S.articleOrder },
    l4ChildOrder:   { ...S.l4ChildOrder },
    r4ArtOrder:     { ...S.r4ArtOrder },
    l2Collapsed:    [...S.l2Collapsed],
    suiteCollapsed: [...S.suiteCollapsed],
    suppressedArts: { ...S.suppressedArts },
    historyLog:     [...S.historyLog],
    rightStructure: JSON.parse(JSON.stringify(RIGHT)),
    // Readable mapping — the final deliverable, embedded in the same file
    mapping: buildMapping()
  };
}

function buildMapping() {
  function nodeToObj(n) {
    if (!n) return null;
    return { label:n.label, type:n.type, id:n.id, count:n.count||0, zid:n.zid||null };
  }
  function exportSubsection(sub) {
    const subAssigned = sortedAssigned(sub.id).map(([id]) => nodeIndex[id]).filter(Boolean);
    const subObj = { section: sub.label, assigned: subAssigned.map(nodeToObj) };
    const subArts = S.directArticles[sub.id];
    if (subArts?.length) subObj.articles = subArts.map(a => ({id:a.id, title:a.title, url:a.url}));
    if (sub.subsections?.length) subObj.subsections = sub.subsections.map(exportSubsection);
    return subObj;
  }
  const result = { suites: [] };
  RIGHT.forEach(suite => {
    const suiteObj = { suite: suite.label, sections: [] };
    suite.sections.forEach(sec => {
      const secObj = { section: sec.label, assigned: [] };
      const directArts = S.directArticles[sec.id];
      if (directArts?.length) secObj.articles = directArts.map(a => ({id:a.id, title:a.title, url:a.url}));
      getUnifiedL3Items(sec.id).forEach(item => {
        if (item.type === 'node') {
          const node = nodeIndex[item.id];
          if (node) secObj.assigned.push(nodeToObj(node));
        } else {
          const sub = findSecById(item.id);
          if (sub) secObj.assigned.push(exportSubsection(sub));
        }
      });
      suiteObj.sections.push(secObj);
    });
    result.suites.push(suiteObj);
  });
  return result;
}

const FB_CONFIG = {
  apiKey:            "AIzaSyD-Bs8qdAnXD349pHN8h7dzxPn7_Yh7g-E",
  authDomain:        "kb-restructure.firebaseapp.com",
  databaseURL:       "https://kb-restructure-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "kb-restructure",
  storageBucket:     "kb-restructure.firebasestorage.app",
  messagingSenderId: "925145313165",
  appId:             "1:925145313165:web:3c39f242f802376cb057c4"
};
let fbDB          = null;
let fbStateRef    = null;
let fbLastRemoteTs = null;
let fbAutoSaveTimer = null;
let fbIsSaving    = false;
let fbHasPendingLocalEdit = false; // true from the moment a local edit happens until it's confirmed written to Firebase
let FB_USER       = null;

function fbSetStatus(state) {
  // state: 'ok' | 'error' | 'syncing' | 'offline'
  const el = document.getElementById('fb-status');
  if (!el) return;
  const map = { ok:['#4a8','Connected'], syncing:['#f90','Syncing…'], error:['#c44','Firebase error'], offline:['#bbb','Firebase offline'] };
  const [color, title] = map[state] || map.offline;
  el.style.color = color;
  el.title = `Firebase: ${title}`;
}

function getUserName() {
  let name = localStorage.getItem('kb-username');
  if (!name) {
    name = prompt('Your name (shows who made changes):') || 'Anonymous';
    localStorage.setItem('kb-username', name.trim() || 'Anonymous');
  }
  return localStorage.getItem('kb-username');
}

function showSyncBanner(by, ts) {
  const banner = document.getElementById('sync-banner');
  const text   = document.getElementById('sync-banner-text');
  if (!banner || !text) return;
  const d = new Date(ts);
  const timeStr = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  text.textContent = `${by} saved changes at ${timeStr} — your view may be outdated.`;
  banner.style.display = 'flex';
}

function applySyncFromFirebase() {
  if (!fbStateRef) { flashStatus('⚠ Firebase not connected'); return; }
  fbSetStatus('syncing');
  fbStateRef.once('value').then(snap => {
    const data = snap.val();
    if (!data) { flashStatus('⚠ Nothing in Firebase yet'); fbSetStatus('ok'); return; }
    if (restoreFromPayload(data)) {
      // Merge history logs — union by ts+text key
      if (data.historyLog && Array.isArray(data.historyLog)) {
        const existingKeys = new Set(S.historyLog.map(e => e.ts + e.text));
        const newEntries = data.historyLog.filter(e => !existingKeys.has(e.ts + e.text));
        if (newEntries.length) {
          S.historyLog.push(...newEntries);
          S.historyLog.sort((a,b) => (a.ts > b.ts ? 1 : -1));
          try { localStorage.setItem(LS_HISTORY_KEY, JSON.stringify(S.historyLog)); } catch(e) {}
        }
      }
      fbLastRemoteTs = data.savedAt;
      logEvent(`Synced from Firebase (saved by ${data.savedBy || 'unknown'})`);
      flashStatus(`Synced — ${Object.keys(S.assignments).length} assignments`);
      const banner = document.getElementById('sync-banner');
      if (banner) banner.style.display = 'none';
      render();
      renderHistoryDrawer();
      fbSetStatus('ok');
    } else {
      flashStatus('⚠ Sync failed — incompatible format');
      fbSetStatus('error');
    }
  }).catch(e => { flashStatus('⚠ Firebase error: ' + e.message); fbSetStatus('error'); });
}

function fbWriteState(onDone) {
  if (!fbStateRef) { if (onDone) onDone(false); return; }
  const payload = buildProgressPayload();
  payload.savedBy = FB_USER;
  fbIsSaving = true;
  fbSetStatus('syncing');
  fbStateRef.set(payload).then(() => {
    fbLastRemoteTs = payload.savedAt;
    fbSetStatus('ok');
    fbHasPendingLocalEdit = false;
    setTimeout(() => { fbIsSaving = false; }, 1500);
    if (onDone) onDone(true);
  }).catch(e => {
    fbIsSaving = false;
    fbSetStatus('error');
    console.warn('Firebase write failed:', e);
    if (onDone) onDone(false);
  });
}

function initFirebase() {
  try {
    firebase.initializeApp(FB_CONFIG);
    fbDB       = firebase.database();
    fbStateRef = fbDB.ref('kb-state');
    FB_USER    = getUserName();
    fbSetStatus('syncing');
    // On init, check if Firebase has a newer state than localStorage
    fbStateRef.once('value').then(snap => {
      const data = snap.val();
      if (data && data.savedAt) {
        fbLastRemoteTs = data.savedAt;
        const localTs = (() => { try { const p = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); return p.savedAt||''; } catch(e) { return ''; } })();
        if (data.savedAt > localTs && data.savedBy !== FB_USER) {
          // Firebase has newer data from another user
          showSyncBanner(data.savedBy || 'Someone', data.savedAt);
        }
      }
      fbSetStatus('ok');
      // Listen for subsequent changes from other users
      fbStateRef.on('value', snap => {
        if (fbIsSaving) return;
        const d = snap.val();
        if (!d || !d.savedAt) return;
        if (d.savedAt === fbLastRemoteTs) return;
        fbLastRemoteTs = d.savedAt;
        if (d.savedBy && d.savedBy !== FB_USER) {
          if (fbHasPendingLocalEdit) {
            // You have an unsynced local edit in flight, don't clobber it silently.
            // Fall back to the banner so you can choose when to apply.
            showSyncBanner(d.savedBy, d.savedAt);
          } else {
            // No pending local edit, safe to apply the remote change immediately.
            applySyncFromFirebase();
          }
        }
      });
    }).catch(e => { console.warn('Firebase read failed:', e); fbSetStatus('error'); });
  } catch(e) {
    console.warn('Firebase init failed:', e);
    fbSetStatus('offline');
  }
}

function autoSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(buildProgressPayload())); } catch(e) {}
  // Debounced Firebase write — 2.5s after last action
  if (fbStateRef) {
    fbHasPendingLocalEdit = true;
    clearTimeout(fbAutoSaveTimer);
    fbAutoSaveTimer = setTimeout(fbWriteState, 2500);
  }
}

function restoreFromPayload(payload) {
  if (!payload || typeof payload.assignments !== 'object') return false;
  S.assignments    = { ...payload.assignments };
  S.directArticles = { ...(payload.directArticles || {}) };
  S.sectionOrder   = { ...(payload.sectionOrder   || {}) };
  S.articleOrder   = { ...(payload.articleOrder   || {}) };
  S.l4ChildOrder   = { ...(payload.l4ChildOrder   || {}) };
  S.r4ArtOrder     = { ...(payload.r4ArtOrder     || {}) };
  S.l2Collapsed    = new Set(payload.l2Collapsed   || []);
  S.suiteCollapsed = new Set(payload.suiteCollapsed || []);
  S.suppressedArts = { ...(payload.suppressedArts  || {}) };
  // Note: historyLog is never restored — it is append-only and persists independently
  if (payload.rightStructure && Array.isArray(payload.rightStructure)) {
    RIGHT.splice(0, RIGHT.length, ...payload.rightStructure);
    for (const k in rsecIndex) delete rsecIndex[k];
    for (const k in suiteIndex) delete suiteIndex[k];
    function indexSections(arr, suite) {
      arr.forEach(s => {
        rsecIndex[s.id] = s;
        suiteIndex[suite.id] = suite;
        s.suiteColor = suite.color;
        if (s.subsections) indexSections(s.subsections, suite);
      });
    }
    RIGHT.forEach(suite => { suiteIndex[suite.id] = suite; indexSections(suite.sections, suite); });
  }
  S.undoStack = [];
  S.redoStack = [];
  updateUndoButtons();
  render();
  return true;
}

function triggerDownload(filename, json) {
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

function saveProgress() {
  const payload = buildProgressPayload();
  const ts = new Date().toISOString().replace(/:/g,'-').replace(/\..+/,'');
  triggerDownload(`kb-mapping-${ts}.json`, JSON.stringify(payload, null, 2));
  try { localStorage.setItem(LS_LAST_SAVE_KEY, JSON.stringify(payload)); } catch(e) {}
  // Also write to Firebase immediately (cancels any pending debounce)
  clearTimeout(fbAutoSaveTimer);
  fbWriteState(ok => {
    logEvent(ok ? `Saved (synced to Firebase as ${FB_USER})` : 'Saved (Firebase sync failed — local only)');
    flashStatus(ok ? `Saved & synced` : 'Saved locally');
  });
}

function resetToLastSave() {
  try {
    const saved = localStorage.getItem(LS_LAST_SAVE_KEY);
    if (!saved) { flashStatus('⚠ No save found — click Save first'); return; }
    const payload = JSON.parse(saved);
    if (restoreFromPayload(payload)) {
      S.undoStack = []; S.redoStack = [];
      logEvent('Reset to last save');
      flashStatus('Reset to last save');
      render();
    }
  } catch(e) { flashStatus('⚠ Could not restore last save'); }
}

function loadProgressClick() {
  document.getElementById('load-input').click();
}

function loadProgress(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload || typeof payload !== 'object') {
        flashStatus('⚠ Could not read file — not valid JSON'); input.value = ''; return;
      }
      if (payload.suites && !payload.assignments) {
        flashStatus('⚠ This looks like an export file, not a save file — use 💾 Save to create a loadable file'); input.value = ''; return;
      }
      if (typeof payload.assignments !== 'object') {
        flashStatus('⚠ Unrecognised file format — missing assignments data'); input.value = ''; return;
      }
      if (restoreFromPayload(payload)) {
        const count = Object.keys(S.assignments).length;
        logEvent(`Loaded — ${count} assignment${count !== 1 ? 's' : ''} restored`);
        flashStatus(`Loaded — ${count} assignment${count !== 1 ? 's' : ''} restored`);
        autoSave();
      } else {
        flashStatus('⚠ File loaded but could not be restored — it may be from an incompatible version');
      }
    } catch(err) {
      flashStatus('⚠ Could not parse file — ' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
// Restore last autosaved session, or do a fresh render
let _sessionRestored = false;
try {
  // Restore history log from its own persistent key (never cleared by session restore)
  try {
    const _savedLog = localStorage.getItem(LS_HISTORY_KEY);
    if (_savedLog) S.historyLog = JSON.parse(_savedLog);
  } catch(e) {}

  const _saved = localStorage.getItem(LS_KEY);
  if (_saved) {
    const _payload = JSON.parse(_saved);
    if (_payload && _payload.assignments && Object.keys(_payload.assignments).length > 0) {
      _sessionRestored = restoreFromPayload(_payload);
      if (_sessionRestored) flashStatus(`Session restored — ${Object.keys(S.assignments).length} assignments`);
    }
  }
} catch(e) {}
if (!_sessionRestored) render();
initCollapseAll();
preloadAllArticles();
// Connect to Firebase after initial render (non-blocking)
initFirebase();
